            <section id="shelf" class="card" onclick="onCardClick('shelf', event)" aria-label="Projects">
                <button class="card-toggle" onclick="toggleFocus('shelf', event)" aria-label="Expand projects"><i class="fa-solid fa-plus ic-open"></i><span class="t-more">Click to read more</span><i class="fa-solid fa-arrow-left ic-back"></i><span class="t-back">Back to main</span></button>
                <div class="card-frame"><div class="card-inner">
                    <div class="mini-label"><i class="fa-solid fa-plus"></i><span>Projects</span></div>
                    <div class="card-scroll" id="shelfBody" style="display:flex;flex-direction:column"></div>
                </div></div>
            </section>
        </div>
    </main>

    <!-- VISTA AMPLIADA: juegos, articulos y el vault se leen aqui, sin cambiar de pagina -->
    <aside id="panel" aria-hidden="true" aria-label="Details">
        <button class="panel-back" onclick="closePanel()"><i class="fa-solid fa-arrow-left"></i> Back to main <kbd>Esc</kbd></button>
        <div id="panelBody"></div>
        <div class="panel-foot">
            <button class="btn-back" onclick="closePanel()"><i class="fa-solid fa-rotate-left"></i> Back to main</button>
        </div>
    </aside>


    <script src="data.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const isDesktop = () => matchMedia('(min-width: 1024px)').matches;

        // ---------- DIALOGO (efecto maquina de escribir) ----------
        let typeTimer = null, currentLine = '';
        function say(text) {
            if (text === currentLine && typeTimer) return;
            currentLine = text;
            const el = $('dialogueText');
            el.textContent = '';
            clearInterval(typeTimer);
            let i = 0;
            typeTimer = setInterval(() => {
                el.textContent = text.slice(0, ++i);
                if (i >= text.length) { clearInterval(typeTimer); typeTimer = null; }
            }, 17);
        }
        // Como en los juegos: un clic mientras escribe completa la frase
        function finishLine() {
            if (!typeTimer) return false;
            clearInterval(typeTimer); typeTimer = null;
            $('dialogueText').textContent = currentLine;
            return true;
        }
        let hoverTimer = null;
        function sayOnHover(text) {
            if (!introDone || isPanelOpen) return;
            clearTimeout(hoverTimer);
            hoverTimer = setTimeout(() => say(text), 110);
        }
        const IDLE_LINE = () => isDesktop()
            ? "Here's the merchandise: my CV, my games and my writings. Hover anything and I'll tell you about it!"
            : "Here's the merchandise: my CV, my games and my writings. Tap anything to see more!";

        // ---------- FICHA DE PERSONAJE ----------
        function renderSheet() {
            const [first, ...rest] = profile.name.split(' ');
            $('sheetName').innerHTML = `${first} ${rest.slice(0, -1).join(' ')} <em>${rest[rest.length - 1]}</em>`;
            $('sheetTitle').textContent = profile.title;
            const roles = `<div class="roles">${profile.roles.map(r => `<div class="role"><h4>${r.name}</h4><ul>${r.points.map(p => `<li>${p}</li>`).join('')}</ul></div>`).join('')}</div>`;
            $('sheetBody').innerHTML = `
                <div class="less">
                    <p class="pitch big">${profile.pitch}</p>
                </div>
                <div class="more sheet-full">
                    <div>
                        <p class="pitch">${profile.pitch}</p>
                        <div class="sec"><div class="sec-title">Roles</div>${roles}</div>
                    </div>
                    <div>
                        <div class="sec" style="margin-top:0"><div class="sec-title">Info</div>
                            <ul class="facts">${profile.facts.map(f => `<li><i class="fa-solid ${f.icon}"></i><span>${f.text}</span></li>`).join('')}</ul>
                        </div>
                        <div class="sec"><div class="sec-title">Tools</div>
                            <div class="chips">${profile.tools.map(t => `<span class="chip">${t}</span>`).join('')}</div>
                        </div>
                    </div>
                    <div>
                        <div class="sec" style="margin-top:0"><div class="sec-title">Honors &amp; awards</div>
                            <ol class="awards">${profile.awards.map(a => `<li><span>${a.text}${a.note ? ` <small>(${a.note})</small>` : ''}</span></li>`).join('')}</ol>
                        </div>
                        <a class="expand-btn" href="assets/cv-juan-a-calero.pdf" download="Juan A. Calero - CV.pdf"><i class="fa-solid fa-download"></i> Download CV (PDF)</a>
                    </div>
                </div>`;
            $('sheet').addEventListener('mouseenter', () => { if (!focused) sayOnHover(profile.dialogue); });
        }

        // ---------- ESTANTERIA ----------
        function itemAttrs(p) {
            const hover = `onmouseenter="sayProject('${p.id}')" onfocus="sayProject('${p.id}')"`;
            return p.external
                ? `href="${p.external}" target="_blank" rel="noopener" ${hover}`
                : `href="#${p.id}" onclick="openProject('${p.id}', event)" ${hover}`;
        }
        function sayProject(id) { const p = projects.find(x => x.id === id); if (p) sayOnHover(p.dialogue || p.summary); }

        function renderShelf() {
            const feat = projects.find(p => p.featured) || projects[0];
            // los enlaces externos (itch.io) van en la cabecera, no en la estanteria
            const rest = projects.filter(p => p !== feat && !p.external);
            const stats = (feat.stats || []).map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');

            const featuredCard = (cls) => `
                <a class="item featured ${cls}" ${itemAttrs(feat)}>
                    <img class="bg" src="${feat.banner}" alt="">
                    <div class="shade"></div>
                    <span class="year tag tag-paper"><span>${feat.year}</span></span>
                    <div class="info">
                        ${feat.logo ? `<img class="logo" src="${feat.logo}" alt="${feat.title}">` : `<span class="display" style="font-size:28px">${feat.title}</span>`}
                        <span class="role-line">${feat.role || ''} · ${feat.tags[feat.tags.length - 1]}</span>
                        ${stats ? `<div class="stats">${stats}</div>` : ''}
                    </div>
                </a>`;
            // banner estilo Project Vault: imagen de fondo, degradado y el LOGO del juego
            // (si un juego no tiene logo en data.js, se muestra su titulo en texto)
            const banner = (p, big) => {
                const name = p.logo ? `<img class="b-logo" src="${p.logo}" alt="${p.title}">` : `<h4>${p.title}</h4>`;
                const year = `<span class="tag tag-paper"><span>${p.year}</span></span>`;
                return `
                <a class="banner ${big ? 'big' : ''}" ${itemAttrs(p)}>
                    <img class="bg" src="${p.banner}" alt="">
                    <div class="shade"></div>
                    <div class="b-txt">
                        ${big
                            ? `<span class="b-meta">${year}<span class="b-tags">${p.tags.slice(1, 3).join(' · ')}</span></span>${name}<p>${p.summary}</p>`
                            : `${name}<span class="b-meta">${year}</span>`}
                    </div>
                    <i class="fa-solid fa-chevron-right b-go"></i>
                </a>`;
            };

            $('shelfBody').innerHTML = `
              <div class="less">
                <div class="shelf-title">Projects <span class="tag tag-pop"><span>Out on Steam</span></span></div>
                ${featuredCard('')}
                <div class="banners">${rest.map(p => banner(p, false)).join('')}</div>
              </div>
              <div class="more shelf-full">
                <div>
                    <div class="shelf-title">Featured <span class="tag tag-pop"><span>Out on Steam</span></span></div>
                    ${featuredCard('tall')}
                    <p style="font-size:13.5px;line-height:1.45;margin:10px 0 0">${feat.summary}</p>
                </div>
                <div>
                    <div class="shelf-title">More games</div>
                    <div class="banners">${rest.map(p => banner(p, true)).join('')}</div>
                </div>
              </div>`;

            $('shelf').addEventListener('mouseleave', () => { if (!focused) sayOnHover(IDLE_LINE()); });
            $('sheet').addEventListener('mouseleave', () => { if (!focused) sayOnHover(IDLE_LINE()); });
        }

        // ---------- WRITINGS (tercer bloque, bajo el CV) ----------
        function renderWritings() {
            const topic = a => a.topic || a.tag.split(' ')[0];
            const attrs = i => `href="#article-${i}" onclick="openArticle(${i}, event)" onmouseenter="sayOnHover(articles[${i}].dialogue)"`;
            $('writingsBody').innerHTML = `
                <div class="less w-list">${articles.map((a, i) => `
                    <a class="w-row" ${attrs(i)}>
                        <span class="w-thumb"><img src="${a.thumb || a.image}" alt=""></span>
                        <b>${a.title}</b>
                        <span class="w-time"><i class="fa-regular fa-clock"></i> ${a.readTime.replace(/ read$/, '')}</span>
                    </a>`).join('')}
                </div>
                <div class="more w-grid">${articles.map((a, i) => `
                    <a class="w-card" ${attrs(i)}>
                        <img src="${a.image}" alt="">
                        <div class="w-body">
                            <div class="d-meta"><span class="tag tag-accent"><span>${topic(a)}</span></span><span class="tag tag-paper"><span>${a.date ? a.date + ' · ' : ''}${a.readTime}</span></span></div>
                            <h4>${a.title}</h4>
                            <p>${a.summary}</p>
                            <span class="w-read">Read article <i class="fa-solid fa-arrow-right"></i></span>
                        </div>
                    </a>`).join('')}
                </div>`;
            $('writings').addEventListener('mouseleave', () => { if (!focused) sayOnHover(IDLE_LINE()); });
        }

        // ---------- EXPANDIR / EMPUJAR CUADROS ----------
        // Hover: el cuadro gana un poco de ancho (pista). Clic: se expande y el otro queda como tira.
        let focused = null;
        const FOCUS_LINES = {
            sheet: "Here's my full CV: roles, tools, studies and awards. Press Back to main or Esc to return!",
            shelf: "Every game I've worked on, all in one place. Click any of them to see more!",
            writings: "Everything I've written about videogames. Pick one and I'll open it right here!"
        };
        function setFocus(which) {
            if (!isDesktop()) return;
            focused = which;
            const b = document.body;
            b.classList.remove('focus-sheet', 'focus-shelf', 'focus-writings');
            if (which) b.classList.add('focus-' + which);
            ['sheet', 'shelf', 'writings'].forEach(id => {
                $(id).classList.toggle('is-open', id === which);
                $(id).classList.toggle('is-mini', !!which && id !== which);
                $(id).querySelector('.card-toggle').setAttribute('aria-expanded', id === which);
            });
            say(which ? FOCUS_LINES[which] : IDLE_LINE());
        }
        function toggleFocus(which, e) {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            setFocus(focused === which ? null : which);
        }
        function onCardClick(which, e) {
            e.stopPropagation();
            if (e.target.closest('a, button')) return;   // los enlaces y botones hacen lo suyo
            if (focused !== which) setFocus(which);
        }

        // ---------- NAVEGACION DE LA CABECERA ----------
        function goNav(which, e) {
            if (e) e.preventDefault();
            if (!introDone) endIntro();
            if (isPanelOpen) closePanel();
            const id = { cv: 'sheet', projects: 'shelf', writings: 'writings' }[which];
            if (isDesktop()) {
                // CV, proyectos y writings: cada boton abre su bloque ampliado
                setFocus(id);
            } else {
                const stage = $('stage');
                const top = $(id).getBoundingClientRect().top - stage.getBoundingClientRect().top + stage.scrollTop - 14;
                stage.scrollTo({ top, behavior: 'smooth' });
                // respaldo: si el navegador no hace el desplazamiento suave, salta directamente
                setTimeout(() => { if (Math.abs(stage.scrollTop - top) > 40) stage.scrollTop = top; }, 700);
            }
            const el = $(id);
            el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
        }

        // ---------- PANEL DE DETALLE ----------
        let isPanelOpen = false;
        function showPanel(html, line) {
            if (focused) setFocus(null);
            $('panelBody').innerHTML = html + `<div class="end-back"><button class="btn-back" onclick="closePanel()"><i class="fa-solid fa-arrow-left"></i> Back to main</button></div>`;
            $('panelBody').scrollTop = 0;
            document.body.classList.add('panel-open');
            $('panel').setAttribute('aria-hidden', 'false');
            isPanelOpen = true;
            if (line) say(line);
        }
        function closePanel() {
            if (!isPanelOpen) return;
            document.body.classList.remove('panel-open');
            $('panel').setAttribute('aria-hidden', 'true');
            isPanelOpen = false;
            $('panelBody').querySelectorAll('video').forEach(v => v.pause());
            say("What else would you like to see? Everything else is still on display.");
        }

        function openProject(id, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            const p = projects.find(x => x.id === id);
            if (!p) return;
            const tagCls = ['tag-accent', 'tag-pop', 'tag-paper'];
            // datos rapidos: los de data.js o, si no hay, se sacan de las etiquetas
            const facts = p.facts || [['Year', p.year], ['Context', p.tags[0]], ['Genre', p.tags[1]], ['Engine', p.tags[2]]].filter(f => f[1]);
            const stats = (p.stats || []).map(([n, l]) => `<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
            const links = (p.links || []).map(l => `<a class="btn-link" href="${l.url}" target="_blank" rel="noopener">${l.text} <i class="fa-solid fa-arrow-up-right-from-square"></i></a>`).join('');
            const shots = (p.screenshots || []).map(s => `<img src="${s}" alt="${p.title} screenshot" loading="lazy">`).join('');
            const contribs = (p.contributions || []).map(c => `
                <section class="contrib">
                    <h4>${c.role}</h4>
                    <ul>${c.points.map(x => `<li>${x}</li>`).join('')}</ul>
                    ${c.note ? `<p class="note">${c.note}</p>` : ''}
                    ${c.highlights ? `<div class="hl-grid">${c.highlights.map(([t, d]) => `<div class="hl"><b>${t}</b><span>${d}</span></div>`).join('')}</div>` : ''}
                </section>`).join('');
            const html = `
                <header class="d-hero">
                    <img class="bg" src="${p.banner}" alt="">
                    <div class="shade"></div>
                    <div class="d-hero-txt">
                        <div class="d-meta"><span class="tag tag-paper"><span>${p.year}</span></span>${p.tags.map((t, i) => `<span class="tag ${tagCls[i % 2]}"><span>${t}</span></span>`).join('')}</div>
                        ${p.logo ? `<img class="d-logo" src="${p.logo}" alt="${p.title}">` : `<h2 class="d-title">${p.title}</h2>`}
                        <p class="d-sum">${p.summary}</p>
                    </div>
                </header>
                <div class="d-grid">
                    <div class="d-main">
                        ${p.about ? `<h3 class="d-h">About the game</h3><p>${p.about}</p>` : (p.details || '')}
                        ${p.video ? `<video controls muted preload="metadata"><source src="${p.video}" type="video/mp4"></video>` : ''}
                        ${contribs ? `<h3 class="d-h">My contributions</h3>${contribs}` : ''}
                        ${shots ? `<h3 class="d-h">Screenshots</h3><div class="shots">${shots}</div>` : ''}
                        ${!p.about && !p.details && !contribs ? `<p class="d-soon">A full write-up of this project is coming soon.</p>` : ''}
                    </div>
                    <aside class="d-side">
                        ${stats ? `<div class="stats">${stats}</div>` : ''}
                        <dl class="d-facts">${facts.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
                        ${links ? `<div class="d-links">${links}</div>` : ''}
                        <button class="back-mini" onclick="openVault(event)"><i class="fa-solid fa-grip"></i> All projects</button>
                    </aside>
                </div>`;
            showPanel(html, p.dialogue || "Take your time, there's plenty to see.");
        }

        // Articulos: se leen aqui mismo, a pantalla grande
        function openArticle(i, event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }
            const a = articles[i];
            if (!a) return;
            const others = articles.map((o, j) => j === i ? '' : `
                <button class="article" onclick="openArticle(${j}, event)"><img src="${o.image}" alt=""><span><b>${o.title}</b><small>${o.tag} · ${o.readTime}</small></span></button>`).join('');
            const html = `
                <header class="d-hero art">
                    <img class="bg" src="${a.image}" alt="">
                    <div class="shade"></div>
                    <div class="d-hero-txt">
                        <div class="d-meta"><span class="tag tag-accent"><span>${a.tag}</span></span><span class="tag tag-paper"><span>${a.date || ''}${a.date ? ' · ' : ''}${a.readTime}</span></span></div>
                        <h2 class="d-title">${a.title}</h2>
                    </div>
                </header>
                <article class="prose">${a.content || `<p>${a.summary}</p>`}</article>
                ${others ? `<div class="prose more-reads"><h3>Keep reading</h3>${others}</div>` : ''}`;
            showPanel(html, a.dialogue);
        }

        function openVault(event) {
            if (event) { event.preventDefault(); event.stopPropagation(); }

            const html = `
                <header class="vault-head"><span class="tag tag-accent"><span>All my projects</span></span><h2 class="d-title">Project Vault</h2></header>
                <div class="vault-grid">${projects.map(p => {
                const open = p.external ? `<a class="proj-card" href="${p.external}" target="_blank" rel="noopener">` : `<button class="proj-card" onclick="openProject('${p.id}', event)">`;
                return `${open}<img src="${p.banner}" alt=""><div class="shade"></div>
                    <span class="tag tag-paper" style="position:absolute;top:10px;left:10px"><span>${p.year}</span></span>
                    <div class="txt"><h3>${p.title}</h3><p>${p.summary}</p></div>${p.external ? '</a>' : '</button>'}`;
            }).join('')}</div>`;
            showPanel(html, vault.dialogue);
        }

        // ---------- INTRO: el tendero saluda, se aparta y entra la mercancia ----------
        let introDone = false, introTimer = null;
        function endIntro() {
            if (introDone) return;
            introDone = true;
            clearTimeout(introTimer);
            document.body.classList.add('swiping', 'intro-done');
            setTimeout(() => { document.body.classList.add('goods-in'); say(IDLE_LINE()); }, 380);
            setTimeout(() => document.body.classList.remove('swiping'), 1000);
        }
        function onKeeperClick(e) {
            e.stopPropagation();
            if (!introDone) return endIntro();
            if (finishLine()) return;
            if (isPanelOpen) closePanel();
        }
        function onStageClick() {
            if (!introDone) return endIntro();
            if (isPanelOpen) closePanel();
            else if (focused) setFocus(null);
        }
        addEventListener('keydown', e => {
            if (!introDone) return endIntro();
            if (e.key !== 'Escape') return;
            if (isPanelOpen) closePanel();
            else if (focused) setFocus(null);
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderSheet();
            renderShelf();
            renderWritings();
            setTimeout(() => {
                $('loading').classList.add('gone');
                document.body.classList.add('ready');
                say("Welcome to my shop! I'm Juan A. Calero, game designer and producer, and everything on display today is about me!");
                introTimer = setTimeout(endIntro, 2600);
            }, 700);
        });
    </script>
</body>
</html>
