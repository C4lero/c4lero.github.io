<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calero - Portfolio</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts: Outfit & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0d11;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        .font-ui {
            font-family: 'Outfit', sans-serif;
        }

        /*background*/
        .shop-background {
            background-image: url('assets/shop-background.png');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
        }

        /*dialoguebox*/
        .dialogue-box-container {
            background-image: url('assets/dialogue-box.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            filter: drop-shadow(0px 10px 25px rgba(0,0,0,0.85));
        }

        /*nametag*/
        .nametag-container {
            background-image: url('assets/name-tag.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            filter: drop-shadow(0px 4px 10px rgba(0,0,0,0.6));
        }

        /* Estilo transparente/dorado para los ítems sobre la balda */
        .rpg-shelf-item {
            background: rgba(15, 12, 10, 0.75);
            backdrop-filter: blur(4px);
            border: 2px solid #d97706;
            box-shadow: 0 0 15px rgba(217, 119, 6, 0.4), inset 0 0 10px rgba(0,0,0,0.8);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

            .rpg-shelf-item:hover {
                transform: scale(1.1) translateY(-4px);
                background: rgba(25, 20, 15, 0.9);
                border-color: #fbbf24;
                box-shadow: 0 0 25px rgba(245, 158, 11, 0.8);
            }

        .smooth-transition {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease, opacity 0.6s ease, max-width 0.6s ease;
        }

        /*vendor anim*/
        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .shopkeeper-idle {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="h-screen flex flex-col select-none overflow-hidden">

    <!--NAVBAR -->
    <header class="fixed top-0 left-0 w-full z-50 bg-slate-950/90 backdrop-blur-md border-b border-slate-800 px-6 py-3 flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-amber-500 rounded-lg flex items-center justify-center text-slate-950 font-extrabold font-ui text-base shadow-lg tracking-wider">
                JC
            </div>
            <div>
                <h1 class="font-bold text-slate-100 text-base tracking-wide font-ui">Juan A. Calero</h1>
                <p class="text-xs text-amber-400 font-medium">Game Producer & Developer</p>
            </div>
        </div>

        <!-- Contact Info / CV -->
        <div class="flex items-center gap-6 text-xs md:text-sm">
            <a href="tel:+34 633 614 852" class="flex items-center gap-2 text-slate-300 hover:text-amber-400 transition">
                <i class="fa-solid fa-phone text-amber-500"></i>
                <span class="hidden sm:inline">+34 633 614 852</span>
            </a>
            <a href="mailto:jacalerodev@gmail.com" class="flex items-center gap-2 text-slate-300 hover:text-amber-400 transition">
                <i class="fa-solid fa-envelope text-amber-500"></i>
                <span class="hidden sm:inline">jacalerodev@gmail.com</span>
            </a>
            <a href="assets/cv-juan-a-calero.pdf" download="Juan A. Calero - CV.pdf" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-lg transition flex items-center gap-2 shadow-md hover:shadow-amber-500/20 font-ui text-xs tracking-wider uppercase">
                <i class="fa-solid fa-download"></i>
                <span>Download CV</span>
            </a>
        </div>
    </header>


    <!-- Shop Scene-->
    <main id="mainScene" onclick="handleBackgroundClick(event)" class="shop-background relative flex-1 w-full pt-16 overflow-hidden flex items-center justify-center cursor-pointer">

        <!-- Viñeta de oscurecimiento suave -->
        <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-transparent to-black/40 pointer-events-none"></div>

        <!-- CONTENEDOR ESCALADO 16:9 (Alinea los ítems exactamente sobre la imagen de fondo) -->
        <div id="shelvesContainer" class="smooth-transition relative w-full max-w-6xl aspect-[16/9] max-h-[85vh] pointer-events-auto">

            <!-- BALDA IZQUIERDA - SUPERIOR (Game Producer) -->
            <button onclick="selectItem('game-producer', 'left', event)"
                    class="rpg-shelf-item absolute left-[5%] md:left-[8%] top-[12%] md:top-[16%] w-32 h-32 md:w-44 md:h-44 rounded-2xl p-2.5 flex flex-col items-center justify-between group cursor-pointer z-10">
                <div class="w-full h-20 md:h-28 flex items-center justify-center">
                    <img src="assets/item-producer.png" alt="Game Producer" class="max-h-full max-w-full object-contain group-hover:scale-110 transition">
                </div>
                <span class="font-ui font-extrabold text-[10px] md:text-xs text-amber-200 text-center uppercase tracking-wider leading-tight">Game Producer</span>
            </button>

            <!-- BALDA IZQUIERDA - INFERIOR (Featured Game) -->
            <button onclick="selectItem('featured-game', 'left', event)"
                    class="rpg-shelf-item absolute left-[5%] md:left-[8%] top-[48%] md:top-[48%] w-32 h-32 md:w-44 md:h-44 rounded-2xl p-2.5 flex flex-col items-center justify-between group cursor-pointer z-10">
                <div class="w-full h-20 md:h-28 flex items-center justify-center">
                    <img src="assets/item-projects.png" alt="Featured Projects" class="max-h-full max-w-full object-contain group-hover:scale-110 transition">
                </div>
                <span class="font-ui font-extrabold text-[10px] md:text-xs text-cyan-200 text-center uppercase tracking-wider leading-tight">Featured Projects</span>
            </button>

            <!-- BALDA DERECHA - SUPERIOR (Articles) -->
            <button onclick="selectItem('articles', 'right', event)"
                    class="rpg-shelf-item absolute right-[5%] md:right-[8%] top-[12%] md:top-[16%] w-32 h-32 md:w-44 md:h-44 rounded-2xl p-2.5 flex flex-col items-center justify-between group cursor-pointer z-10">
                <div class="w-full h-20 md:h-28 flex items-center justify-center">
                    <img src="assets/item-designer.png" alt="Game Designer" class="max-h-full max-w-full object-contain group-hover:scale-110 transition">
                </div>
                <span class="font-ui font-extrabold text-[10px] md:text-xs text-emerald-200 text-center uppercase tracking-wider leading-tight">Game Designer</span>
            </button>

            <!-- BALDA DERECHA - INFERIOR (Projects Log) -->
            <button onclick="selectItem('projects-log', 'right', event)"
                    class="rpg-shelf-item absolute right-[5%] md:right-[8%] top-[48%] md:top-[48%] w-32 h-32 md:w-44 md:h-44 rounded-2xl p-2.5 flex flex-col items-center justify-between group cursor-pointer z-10">
                <div class="w-full h-28 flex items-center justify-center">
                    <img src="assets/item-articles.png" alt="Articles" class="max-h-full max-w-full object-contain group-hover:scale-110 transition">
                </div>
                <span class="font-ui font-extrabold text-[10px] md:text-xs text-purple-200 text-center uppercase tracking-wider leading-tight">Articles</span>
            </button>

        </div>


        <!-- 3. SHOPKEEPER + DIALOGUE GROUP -->
        <div id="characterGroup" class="smooth-transition absolute inset-x-0 bottom-0 top-16 flex flex-col items-center justify-end pb-3 z-20 pointer-events-none">

            <!-- THE SHOPKEEPER (Escalado de tamaño porcentual relativo al viewport) -->
            <div onclick="handleShopkeeperClick(event)" class="relative flex flex-col items-center justify-end pointer-events-auto cursor-pointer -mb20 md:-mb20 z-10 -translate-y-12">
                <div class="shopkeeper-idle relative h-[38vh] sm:h-[45vh] lg:h-[52vh] w-auto aspect-square flex items-center justify-center">
                    <div class="absolute w-[80%] h-[80%] bg-amber-500/20 rounded-full blur-3xl"></div>
                    <img src="assets/vendedor.png" alt="Shopkeeper" class="w-full h-full object-contain drop-shadow-[0_20px_35px_rgba(0,0,0,0.95)]">
                </div>
            </div>

            <!-- DIALOGUE BOX -->
            <div id="dialogueWrapper" onclick="handleShopkeeperClick(event)" class="pointer-events-auto relative w-full max-w-4xl px-4 pt-3 smooth-transition cursor-pointer">
                <div class="dialogue-box-container relative px-6 md:px-8 py-5 md:py-6 min-h-[110px] flex items-center">

                    <!-- Name Tag Box -->
                    <div class="nametag-container absolute -top-8 left-6 md:left-8 w-48 md:w-56 h-14 md:h-16 flex items-end justify-center pb-2.5 pt-4 px-3">
                        <span class="font-ui font-extrabold text-xs md:text-[13px] text-amber-100 tracking-wider uppercase drop-shadow-[0_2px_4px_rgba(0,0,0,0.9)] text-center leading-none">
                            Shopkeeper
                        </span>
                    </div>

                    <!-- Dialogue Text -->
                    <p id="dialogueText" class="font-ui font-semibold text-slate-800 text-xs md:text-sm lg:text-base leading-relaxed pl-2 pr-6">
                        <!-- Dynamic typewriter text -->
                    </p>

                    <!-- Pulsing Arrow Indicator -->
                    <div class="absolute bottom-3 right-6 text-slate-700 animate-bounce text-xs md:text-sm">
                        <i class="fa-solid fa-caret-down"></i>
                    </div>
                </div>
            </div>

        </div>


        <!-- 4. SLIDING DETAILS PANEL -->
        <!-- Left Drawer -->
        <aside id="detailsPanelLeft" onclick="event.stopPropagation()" class="fixed top-16 left-0 bottom-0 bg-slate-950/95 border-r-4 border-amber-500 shadow-2xl z-50 transform -translate-x-full transition-transform duration-500 ease-out flex flex-col pointer-events-auto">
            <div class="p-6 border-b border-slate-800 flex items-center gap-4 bg-slate-900/50">
                <div id="panelIconLeft" class="w-14 h-14 rounded-xl bg-amber-500/20 border-2 border-amber-500 flex items-center justify-center text-amber-400 text-2xl overflow-hidden p-1"></div>
                <div>
                    <span id="panelCategoryLeft" class="text-xs font-ui font-bold text-amber-400 uppercase tracking-widest">Category</span>
                    <h2 id="panelTitleLeft" class="text-xl md:text-2xl font-extrabold text-slate-100 font-ui">Title</h2>
                </div>
            </div>

            <div id="panelBodyLeft" class="p-6 flex-1 overflow-y-auto space-y-4 text-slate-300 text-sm md:text-base leading-relaxed"></div>

            <div class="p-5 border-t border-slate-800 bg-slate-900/80 flex flex-col gap-3">
                <a id="buyButtonLeft" href="#" target="_blank" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-ui font-bold text-sm py-3.5 px-4 rounded-lg text-center transition flex items-center justify-center gap-2 shadow-lg hover:shadow-amber-500/20 uppercase tracking-wider">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="buyButtonTextLeft">BUY / VIEW MORE</span>
                </a>
                <button onclick="closePanel()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-ui font-semibold text-xs py-2.5 px-4 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>RETURN TO SHOP</span>
                </button>
            </div>
        </aside>

        <!-- Right Drawer -->
        <aside id="detailsPanelRight" onclick="event.stopPropagation()" class="fixed top-16 right-0 bottom-0 bg-slate-950/95 border-l-4 border-amber-500 shadow-2xl z-50 transform translate-x-full transition-transform duration-500 ease-out flex flex-col pointer-events-auto">
            <div class="p-6 border-b border-slate-800 flex items-center gap-4 bg-slate-900/50">
                <div id="panelIconRight" class="w-14 h-14 rounded-xl bg-amber-500/20 border-2 border-amber-500 flex items-center justify-center text-amber-400 text-2xl overflow-hidden p-1"></div>
                <div>
                    <span id="panelCategoryRight" class="text-xs font-ui font-bold text-amber-400 uppercase tracking-widest">Category</span>
                    <h2 id="panelTitleRight" class="text-xl md:text-2xl font-extrabold text-slate-100 font-ui">Title</h2>
                </div>
            </div>

            <div id="panelBodyRight" class="p-6 flex-1 overflow-y-auto space-y-4 text-slate-300 text-sm md:text-base leading-relaxed"></div>

            <div class="p-5 border-t border-slate-800 bg-slate-900/80 flex flex-col gap-3">
                <a id="buyButtonRight" href="#" target="_blank" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-ui font-bold text-sm py-3.5 px-4 rounded-lg text-center transition flex items-center justify-center gap-2 shadow-lg hover:shadow-amber-500/20 uppercase tracking-wider">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="buyButtonTextRight">BUY / VIEW MORE</span>
                </a>
                <button onclick="closePanel()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-ui font-semibold text-xs py-2.5 px-4 rounded-lg transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span>RETURN TO SHOP</span>
                </button>
            </div>
        </aside>

    </main>


    <!-- 5. JAVASCRIPT LOGIC -->
    <script>
        const PANEL_WIDTH_PERCENT = 45;
        let isPanelOpen = false;

        const shopItems = {
            'game-producer': {
                category: 'Career & Experience',
                title: 'Game Producer Resume',
                imgSrc: 'assets/item-producer.png',
                dialogue: "Ah, interested in my work as a Game Producer? Here is my experience managing milestones, budgets, and leading cross-functional teams.",
                buyText: "DOWNLOAD FULL CV",
                buyLink: "#download-cv",
                description: `
                  <p class="font-bold text-amber-400">Specialized in technical production and video game project management.</p>
                  <ul class="list-disc pl-5 space-y-2 mt-2">
                    <li><strong>Team Leadership:</strong> Coordinating art, programming, and narrative design under Agile frameworks (Scrum/Kanban).</li>
                    <li><strong>Development Pipeline:</strong> Roadmap definition, scope control, and risk mitigation.</li>
                    <li><strong>Toolstack:</strong> Jira, Notion, Trello, Git, Unity & Unreal Engine.</li>
                  </ul>
                `
            },
            'featured-game': {
                category: 'Featured Project',
                title: 'Indie RPG: Project Quest',
                imgSrc: 'assets/item-juego.png',
                dialogue: "Excellent choice! This item represents my latest developed title. You can check out its Steam page and play the demo.",
                buyText: "CHECK ON STEAM",
                buyLink: "https://store.steampowered.com",
                description: `
                  <p class="font-bold text-cyan-400">A retro Action-RPG built with attention to detail.</p>
                  <p class="mt-2">Role: <strong>Lead Producer & Game Designer</strong>.</p>
                  <div class="bg-slate-900 p-4 rounded-lg border border-slate-800 mt-3 space-y-2 text-xs md:text-sm">
                    <p>🎮 <strong>Platforms:</strong> PC / Steam</p>
                    <p>⭐ <strong>Milestone:</strong> Over 10,000 demo downloads during Steam Next Fest.</p>
                  </div>
                `
            },
            'articles': {
                category: 'Publications',
                title: 'Articles & Postmortems',
                imgSrc: 'assets/item-articulos.png',
                dialogue: "I love sharing knowledge about production and design. Take a look at my published postmortems and articles.",
                buyText: "READ ON MEDIUM",
                buyLink: "https://medium.com",
                description: `
                  <p class="font-bold text-emerald-400">Deep dives into game production, level design, and game economics.</p>
                  <ul class="list-disc pl-5 space-y-2 mt-2">
                    <li><em>"Surviving Pre-Production Without Scope Creep"</em></li>
                    <li><em>"Designing Incentive Systems in Classic RPGs"</em></li>
                  </ul>
                `
            },
            'projects-log': {
                category: 'Portfolio',
                title: 'Projects & Game Jams',
                imgSrc: 'assets/item-historial.png',
                dialogue: "Here is my full inventory of Game Jams, prototypes, and collaborative experiments.",
                buyText: "EXPLORE ON ITCH.IO",
                buyLink: "https://itch.io",
                description: `
                  <p class="font-bold text-purple-400">A collection of rapid prototypes and game mechanics research.</p>
                  <p class="mt-2">Over 8 completed projects across international jams including Global Game Jam and Ludum Dare.</p>
                `
            }
        };

        let typewriterTimer = null;

        function applyPanelWidths() {
            const pLeft = document.getElementById('detailsPanelLeft');
            const pRight = document.getElementById('detailsPanelRight');

            if (window.innerWidth >= 768) {
                pLeft.style.width = `${PANEL_WIDTH_PERCENT}%`;
                pRight.style.width = `${PANEL_WIDTH_PERCENT}%`;
            } else {
                pLeft.style.width = '100%';
                pRight.style.width = '100%';
            }
        }

        function typeDialogue(text) {
            const el = document.getElementById('dialogueText');
            el.textContent = '';
            let i = 0;
            if (typewriterTimer) clearInterval(typewriterTimer);
            typewriterTimer = setInterval(() => {
                if (i < text.length) {
                    el.textContent += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typewriterTimer);
                }
            }, 18);
        }

        function handleShopkeeperClick(event) {
            event.stopPropagation();
            if (isPanelOpen) {
                closePanel();
            }
        }

        function handleBackgroundClick(event) {
            if (isPanelOpen) {
                closePanel();
            }
        }

        function selectItem(itemId, shelfSide, event) {
            if (event) event.stopPropagation();

            if (isPanelOpen) {
                closePanel();
                return;
            }

            const item = shopItems[itemId];
            if (!item) return;

            const shelvesContainer = document.getElementById('shelvesContainer');
            const characterGroup = document.getElementById('characterGroup');
            const dialogueWrapper = document.getElementById('dialogueWrapper');
            const panelLeft = document.getElementById('detailsPanelLeft');
            const panelRight = document.getElementById('detailsPanelRight');

            // Reset
            panelLeft.classList.add('-translate-x-full');
            panelRight.classList.add('translate-x-full');

            shelvesContainer.classList.add('opacity-30', 'blur-[2px]');

            const shiftPercent = window.innerWidth >= 768 ? (PANEL_WIDTH_PERCENT / 2) : 0;
            const remainingWidthPercent = window.innerWidth >= 768 ? (100 - PANEL_WIDTH_PERCENT - 4) : 90;

            dialogueWrapper.style.maxWidth = `${remainingWidthPercent}vw`;

            if (shelfSide === 'left') {
                characterGroup.style.transform = `translateX(${shiftPercent}vw)`;

                document.getElementById('panelCategoryLeft').textContent = item.category;
                document.getElementById('panelTitleLeft').textContent = item.title;
                document.getElementById('panelIconLeft').innerHTML = `<img src="${item.imgSrc}" class="w-full h-full object-contain">`;
                document.getElementById('panelBodyLeft').innerHTML = item.description;

                const buyBtn = document.getElementById('buyButtonLeft');
                document.getElementById('buyButtonTextLeft').textContent = item.buyText;
                buyBtn.href = item.buyLink;

                panelLeft.classList.remove('-translate-x-full');
            } else {
                characterGroup.style.transform = `translateX(-${shiftPercent}vw)`;

                document.getElementById('panelCategoryRight').textContent = item.category;
                document.getElementById('panelTitleRight').textContent = item.title;
                document.getElementById('panelIconRight').innerHTML = `<img src="${item.imgSrc}" class="w-full h-full object-contain">`;
                document.getElementById('panelBodyRight').innerHTML = item.description;

                const buyBtn = document.getElementById('buyButtonRight');
                document.getElementById('buyButtonTextRight').textContent = item.buyText;
                buyBtn.href = item.buyLink;

                panelRight.classList.remove('translate-x-full');
            }

            isPanelOpen = true;
            typeDialogue(item.dialogue);
        }

        function closePanel() {
            const shelvesContainer = document.getElementById('shelvesContainer');
            const characterGroup = document.getElementById('characterGroup');
            const dialogueWrapper = document.getElementById('dialogueWrapper');
            const panelLeft = document.getElementById('detailsPanelLeft');
            const panelRight = document.getElementById('detailsPanelRight');

            characterGroup.style.transform = 'translateX(0)';
            dialogueWrapper.style.maxWidth = '56rem'; // eq to max-w-4xl

            shelvesContainer.classList.remove('opacity-30', 'blur-[2px]');

            panelLeft.classList.add('-translate-x-full');
            panelRight.classList.add('translate-x-full');

            isPanelOpen = false;
            typeDialogue("What else would you like to inspect? Click on any object on the shelves.");
        }

        window.addEventListener('DOMContentLoaded', () => {
            applyPanelWidths();
            typeDialogue("Welcome to my shop! I am Juan A. Calero. Click on any item on the shelves to explore my work and experience.");
        });

        window.addEventListener('resize', applyPanelWidths);
    </script>
</body>
</html>
