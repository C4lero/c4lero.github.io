<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow: hidden;
        }

        .font-ui {
            font-family: 'Outfit', sans-serif;
        }

        .cel-block-shadow {
            box-shadow: 6px 6px 0px #000000;
        }

        .cel-block-shadow-sm {
            box-shadow: 4px 4px 0px #000000;
        }

        .shop-background {
            background-image: url('assets/shop-background.png');
            background-size: cover;
            background-position: center bottom;
            background-repeat: no-repeat;
        }

        .dialogue-box-container {
            background-image: url('assets/dialogue-box.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        .nametag-container {
            background-image: url('assets/name-tag.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        .rpg-shelf-item {
            background-color: #141259;
            border: 3px solid #000000;
            box-shadow: 6px 6px 0px #000000;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

            .rpg-shelf-item:hover {
                transform: translate(-3px, -5px) scale(1.08) !important;
                background-color: #1c1a75;
                box-shadow: 10px 10px 0px #000000;
                border-color: #F2CD5C;
            }

        /* Variante estilo newsletter/fila para artículos */
        .rpg-article-item {
            background-color: #141259;
            border: 3px solid #000000;
            box-shadow: 5px 5px 0px #000000;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background-color 0.2s, box-shadow 0.2s, border-color 0.2s;
        }

            .rpg-article-item:hover {
                transform: translate(-2px, -3px) scale(1.02) !important;
                background-color: #1c1a75;
                box-shadow: 8px 8px 0px #000000;
                border-color: #F2CD5C;
            }

        .smooth-transition {
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), filter 0.6s ease, opacity 0.6s ease, max-width 0.6s ease;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .shopkeeper-idle {
            animation: float 4s ease-in-out infinite;
        }

        /* LEVITACIÓN SUAVE DE LOS SPRITES DE ITEMS (SINCRO GLOBAL) */
        @keyframes itemFloat {
            0%, 100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .item-sprite-idle {
            animation: itemFloat 3s ease-in-out infinite;
        }

        /* ONDAS CON CAPA Z-INDEX 20 */
        .wave-container-top {
            position: fixed;
            top: 63px;
            left: 0;
            width: 100%;
            height: 75px;
            pointer-events: none;
            overflow: hidden;
            z-index: 20;
            background: transparent;
        }

        .wave-container-bottom {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 75px;
            pointer-events: none;
            overflow: hidden;
            z-index: 20;
            background: transparent;
        }

        .wave-track {
            display: flex;
            width: 200%;
            height: 100%;
            will-change: transform;
        }

            .wave-track svg {
                width: 50%;
                height: 100%;
                flex-shrink: 0;
                display: block;
            }

        @keyframes waveLoop {
            0% {
                transform: translate3d(0, 0, 0);
            }

            100% {
                transform: translate3d(-50%, 0, 0);
            }
        }

        @keyframes waveLoopReverse {
            0% {
                transform: translate3d(-50%, 0, 0);
            }

            100% {
                transform: translate3d(0, 0, 0);
            }
        }

        .animate-wave-white-top {
            animation: waveLoop 38s linear infinite;
        }

        .animate-wave-blue1-top {
            animation: waveLoop 26s linear infinite;
        }

        .animate-wave-blue2-top {
            animation: waveLoop 20s linear infinite;
        }

        .animate-wave-black-top {
            animation: waveLoop 14s linear infinite;
        }

        .animate-wave-white-bot {
            animation: waveLoopReverse 38s linear infinite;
        }

        .animate-wave-blue1-bot {
            animation: waveLoopReverse 26s linear infinite;
        }

        .animate-wave-blue2-bot {
            animation: waveLoopReverse 26s linear infinite;
        }

        .animate-wave-black-bot {
            animation: waveLoopReverse 14s linear infinite;
        }

        @keyframes personaOutlinePulse {
            0% {
                filter: drop-shadow(3px 0px 0px #000) drop-shadow(-3px 0px 0px #000) drop-shadow(0px 3px 0px #000) drop-shadow(0px -3px 0px #000) drop-shadow(3px 3px 0px #000);
            }

            33% {
                filter: drop-shadow(3px 1px 0px #000) drop-shadow(-3px -1px 0px #000) drop-shadow(1px 3px 0px #000) drop-shadow(-1px -3px 0px #000) drop-shadow(4px 4px 0px #000);
            }

            66% {
                filter: drop-shadow(2px 3px 0px #000) drop-shadow(-3px 1px 0px #000) drop-shadow(-1px 3px 0px #000) drop-shadow(2px -3px 0px #000) drop-shadow(3px 4px 0px #000);
            }

            100% {
                filter: drop-shadow(3px -2px 0px #000) drop-shadow(-3px 2px 0px #000) drop-shadow(2px 3px 0px #000) drop-shadow(-2px -3px 0px #000) drop-shadow(4px 3px 0px #000);
            }
        }

        @keyframes personaNametagPulse {
            0% {
                filter: drop-shadow(2px 0px 0px #000) drop-shadow(-2px 0px 0px #000) drop-shadow(0px 2px 0px #000) drop-shadow(0px -2px 0px #000) drop-shadow(2px 2px 0px #000);
            }

            50% {
                filter: drop-shadow(2px 1px 0px #000) drop-shadow(-2px -1px 0px #000) drop-shadow(1px 2px 0px #000) drop-shadow(-1px -2px 0px #000) drop-shadow(3px 2px 0px #000);
            }

            100% {
                filter: drop-shadow(2px -1px 0px #000) drop-shadow(-2px 1px 0px #000) drop-shadow(1px 2px 0px #000) drop-shadow(-1px -2px 0px #000) drop-shadow(2px 3px 0px #000);
            }
        }

        .persona-outline-thick {
            animation: personaOutlinePulse 3.5s ease-in-out infinite alternate;
        }

        .persona-outline-nametag {
            animation: personaNametagPulse 3.5s ease-in-out infinite alternate;
        }

        .particle-container {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .cotl-blob {
            position: absolute;
            border-radius: 50%;
            background: #F2CD5C;
            border: 2px solid #000000;
            box-shadow: 2px 2px 0px #000000;
            animation: floatUp 6s ease-in-out infinite;
        }

        @keyframes floatUp {
            0% {
                opacity: 0;
                transform: translateY(10px) scale(0.6);
            }

            30%, 70% {
                opacity: 0.9;
            }

            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.1);
            }
        }

        .item-particle-aura {
            position: absolute;
            inset: -12px;
            pointer-events: none;
            border-radius: 1rem;
            overflow: hidden;
        }

        .item-blob {
            position: absolute;
            width: 7px;
            height: 7px;
            background: #F2CD5C;
            border: 1px solid #000000;
            border-radius: 50%;
            animation: orbitPulse 3s infinite ease-in-out;
        }

        @keyframes orbitPulse {
            0%, 100% {
                opacity: 0.2;
                transform: scale(0.8) translateY(0);
            }

            50% {
                opacity: 1;
                transform: scale(1.3) translateY(-8px);
            }
        }

        .anim-nav-entry {
            transform: translateY(-100%);
            opacity: 0;
            transition: transform 0.5s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.5s ease;
        }

            .anim-nav-entry.active {
                transform: translateY(0);
                opacity: 1;
            }

        .anim-bg-entry {
            opacity: 0;
            transform: scale(1.03);
            transition: opacity 0.8s ease, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

            .anim-bg-entry.active {
                opacity: 1;
                transform: scale(1);
            }

        .anim-vendor-entry {
            opacity: 0;
            transform: translateY(80px);
            transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.5s ease;
        }

            .anim-vendor-entry.active {
                opacity: 1;
                transform: translateY(0);
            }

        .shelf-item-hidden {
            opacity: 0;
            transform: scale(0) rotate(-10deg);
            transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
        }

        .shelf-item-visible {
            opacity: 1;
            transform: scale(1) rotate(0deg);
        }

        .drawer-panel {
            z-index: 90 !important;
            position: fixed !important;
            top: 0 !important;
            bottom: 0 !important;
            height: 100vh !important;
            padding-top: 63px !important;
        }

        .panel-scroll-content::-webkit-scrollbar {
            width: 100px;
        }

        .panel-scroll-content::-webkit-scrollbar-track {
            background: #000000;
            border-left: 2px solid #141259;
        }

        .panel-scroll-content::-webkit-scrollbar-thumb {
            background: #F2CD5C;
            border: 2px solid #000000;
        }

            .panel-scroll-content::-webkit-scrollbar-thumb:hover {
                background: #F2A766;
            }

        .panel-scroll-content {
            scrollbar-width: thin;
            scrollbar-color: #F2CD5C #000000;
        }
    </style>
</head>

        let typewriterTimer = null;

        function createAmbientParticles() {
            const container = document.getElementById('ambientParticles');
            const particleCount = 20;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'cotl-blob';

                const size = Math.random() * 8 + 6;
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                const duration = Math.random() * 4 + 4;
                const delay = Math.random() * 5;

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${left}%`;
                particle.style.top = `${top}%`;
                particle.style.animationDuration = `${duration}s`;
                particle.style.animationDelay = `${delay}s`;

                container.appendChild(particle);
            }
        }

        function createAuraParticles() {
            const auras = ['aura-producer', 'aura-projects', 'aura-designer', 'aura-articles', 'vendorParticles'];
            auras.forEach(auraId => {
                const el = document.getElementById(auraId);
                if (!el) return;

                const count = auraId === 'vendorParticles' ? 10 : 5;
                for (let i = 0; i < count; i++) {
                    const blob = document.createElement('div');
                    blob.className = 'item-blob';
                    blob.style.left = `${Math.random() * 80 + 10}%`;
                    blob.style.top = `${Math.random() * 80 + 10}%`;
                    blob.style.animationDelay = `${Math.random() * 3}s`;
                    blob.style.animationDuration = `${Math.random() * 2 + 2}s`;
                    el.appendChild(blob);
                }
            });
        }

        function applyPanelWidths() {
            const pLeft = document.getElementById('detailsPanelLeft');
            const pRight = document.getElementById('detailsPanelRight');

            if (window.innerWidth >= 768) {
                pLeft.style.width = `${PANEL_WIDTH_PERCENT}%`;
                pRight.style.width = `${PANEL_WIDTH_PERCENT}%`;
            } else {
                pLeft.style.width = '100%';
                pRight.style.width = '100%';
            }
        }

        function typeDialogue(text) {
            const el = document.getElementById('dialogueText');
            el.textContent = '';
            let i = 0;
            if (typewriterTimer) clearInterval(typewriterTimer);
            typewriterTimer = setInterval(() => {
                if (i < text.length) {
                    el.textContent += text.charAt(i);
                    i++;
                } else {
                    clearInterval(typewriterTimer);
                }
            }, 18);
        }

        function handleShopkeeperClick(event) {
            event.stopPropagation();
            if (isPanelOpen) {
                closePanel();
            }
        }

        function handleBackgroundClick(event) {
            if (isPanelOpen) {
                closePanel();
            }
        }

        function selectItem(itemId, shelfSide, event) {
            if (event) event.stopPropagation();

            const item = shopItems[itemId];
            if (!item) return;

            currentItemId = itemId;

            const shelvesContainer = document.getElementById('shelvesContainer');
            const characterGroup = document.getElementById('characterGroup');
            const dialogueWrapper = document.getElementById('dialogueWrapper');
            const panelLeft = document.getElementById('detailsPanelLeft');
            const panelRight = document.getElementById('detailsPanelRight');

            panelLeft.classList.add('-translate-x-full');
            panelRight.classList.add('translate-x-full');

            shelvesContainer.classList.add('opacity-30', 'blur-[2px]');

            const shiftPercent = window.innerWidth >= 768 ? (PANEL_WIDTH_PERCENT / 2) : 0;
            const remainingWidthPercent = window.innerWidth >= 768 ? (100 - PANEL_WIDTH_PERCENT - 4) : 90;

            dialogueWrapper.style.maxWidth = `${remainingWidthPercent}vw`;

            const targetBody = shelfSide === 'left' ? document.getElementById('panelBodyLeft') : document.getElementById('panelBodyRight');
            const buyButton = shelfSide === 'left' ? document.getElementById('buyButtonLeft') : document.getElementById('buyButtonRight');

            if (shelfSide === 'left') {
                document.getElementById('panelCategoryLeft').textContent = item.category;
                document.getElementById('panelTitleLeft').textContent = item.title;
                document.getElementById('panelIconLeft').innerHTML = `<img src="${item.imgSrc}" class="item-sprite-idle w-full h-full object-contain">`;

                if (item.hideBuyButton) {
                    buyButton.classList.add('hidden');
                } else {
                    buyButton.classList.remove('hidden');
                    document.getElementById('buyButtonTextLeft').textContent = item.buyText;
                    document.getElementById('buyButtonLeft').href = item.buyLink;
                }

                characterGroup.style.transform = `translateX(${shiftPercent}vw)`;
                panelLeft.classList.remove('-translate-x-full');
            } else {
                document.getElementById('panelCategoryRight').textContent = item.category;
                document.getElementById('panelTitleRight').textContent = item.title;
                document.getElementById('panelIconRight').innerHTML = `<img src="${item.imgSrc}" class="item-sprite-idle w-full h-full object-contain">`;

                if (item.hideBuyButton) {
                    buyButton.classList.add('hidden');
                } else {
                    buyButton.classList.remove('hidden');
                    document.getElementById('buyButtonTextRight').textContent = item.buyText;
                    document.getElementById('buyButtonRight').href = item.buyLink;
                }

                characterGroup.style.transform = `translateX(-${shiftPercent}vw)`;
                panelRight.classList.remove('translate-x-full');
            }

            targetBody.innerHTML = item.description;
            targetBody.scrollTop = 0;
            isPanelOpen = true;
            typeDialogue(item.dialogue);
        }

        function closePanel() {
            const shelvesContainer = document.getElementById('shelvesContainer');
            const characterGroup = document.getElementById('characterGroup');
            const dialogueWrapper = document.getElementById('dialogueWrapper');
            const panelLeft = document.getElementById('detailsPanelLeft');
            const panelRight = document.getElementById('detailsPanelRight');

            characterGroup.style.transform = 'translateX(0)';
            dialogueWrapper.style.maxWidth = '48rem';

            shelvesContainer.classList.remove('opacity-30', 'blur-[2px]');

            panelLeft.classList.add('-translate-x-full');
            panelRight.classList.add('translate-x-full');

            isPanelOpen = false;
            currentItemId = null;
            typeDialogue("What else would you like to inspect? Click on any object on the shelves.");
        }

        function runIntroSequence() {
            const overlay = document.getElementById('loadingOverlay');
            const navHeader = document.getElementById('navHeader');
            const mainScene = document.getElementById('mainScene');
            const characterGroup = document.getElementById('characterGroup');
            const shelfItems = document.querySelectorAll('.rpg-shelf-item, .rpg-article-item');

            const hasVisited = sessionStorage.getItem('visitedShop');

            if (hasVisited) {
                if (overlay) overlay.remove();
                navHeader.classList.add('active');
                mainScene.classList.add('active');
                characterGroup.classList.add('active');
                shelfItems.forEach(item => {
                    item.classList.remove('shelf-item-hidden');
                    item.classList.add('shelf-item-visible');
                });
                typeDialogue("¡De vuelta a la tienda! Haz clic en cualquier estantería para inspeccionar.");
            } else {
                sessionStorage.setItem('visitedShop', 'true');
                setTimeout(() => {
                    overlay.classList.add('opacity-0', 'pointer-events-none');
                    setTimeout(() => { overlay.remove(); }, 500);
                    setTimeout(() => { navHeader.classList.add('active'); }, 100);
                    setTimeout(() => { mainScene.classList.add('active'); }, 400);
                    setTimeout(() => { characterGroup.classList.add('active'); }, 700);

                    shelfItems.forEach((item, index) => {
                        setTimeout(() => {
                            item.classList.remove('shelf-item-hidden');
                            item.classList.add('shelf-item-visible');
                        }, 1100 + (index * 150));
                    });

                    setTimeout(() => {
                        typeDialogue("Welcome to my shop! I am Juan A. Calero. Click on any item on the shelves to explore my work and experience.");
                    }, 1800);
                }, 1000);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            applyPanelWidths();
            createAmbientParticles();
            createAuraParticles();
            runIntroSequence();
        });

        window.addEventListener('resize', applyPanelWidths);
    </script>
