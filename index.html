<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Juan A. Calero · Game Designer & Producer</title>
    <meta name="description" content="Portfolio of Juan A. Calero, Game Designer & Producer. Dorothy's Job (Steam), game jams, articles and CV.">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800;1,900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        /* =========================================================
           PALETA: colores planos. Cambia aqui y cambia toda la web.
           ========================================================= */
        :root {
            --ink: #0a0a0c;        /* negro */
            --paper: #ffffff;      /* blanco */
            /* colores sacados de la ilustracion de la silueta */
            --bg: #78c0d8;         /* azul de la camiseta: fondo de la pagina */
            --bg-d: #60a8c0;       /* azul de la trama de puntos de la camiseta */
            --accent: #ff2a2a;     /* rojo del contorno: botones, etiquetas y sombras (texto negro encima) */
            --accent-ink: #c8151b; /* rojo oscuro: texto de color sobre fondo blanco */
            --pop: #30d8ff;        /* cian del contorno: detalles y hover */
            /* (paleta anterior, con azul y rojo al reves: --accent #30d8ff, --accent-ink #1d6f94, --pop #ff2a2a) */
            --hl: #f0d8c0;         /* tono piel: resaltes sobre negro */
            --accent-d: var(--bg-d);

            --display: 'Anton', Impact, sans-serif;
            --ui: 'Barlow Condensed', 'Arial Narrow', sans-serif;
            --body: 'Inter', system-ui, sans-serif;

            --header-h: 64px;
            --ticker-h: 0px;
            --ease-snap: cubic-bezier(.2, 1.4, .4, 1);
            --ease-out: cubic-bezier(.16, 1, .3, 1);
        }

        /* reset base (antes lo aplicaba Tailwind; el diseño cuenta con el) */
        *, *::before, *::after { box-sizing: border-box; border: 0 solid; }
        html { line-height: 1.5; -webkit-text-size-adjust: 100%; tab-size: 4; }
        code, kbd { font-size: 1em; }
        h1, h2, h3, h4, h5, h6 { font-size: inherit; font-weight: inherit; margin: 0; }
        p, blockquote, figure, dl, dd, ol, ul { margin: 0; }
        ol, ul { list-style: none; padding: 0; }
        img, video, svg { display: block; max-width: 100%; height: auto; }
        em, i { font-style: italic; }
        html, body { height: 100%; margin: 0; }
        body {
            font-family: var(--body);
            background: var(--bg);
            color: var(--paper);
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }
        a { color: inherit; text-decoration: none; }
        button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
        :focus-visible { outline: 3px solid var(--hl); outline-offset: 3px; }

        .display { font-family: var(--display); font-weight: 400; text-transform: uppercase; letter-spacing: .01em; line-height: .92; }

        /* chip inclinado: la etiqueta basica de todo el estilo */
        .tag { display: inline-block; font-family: var(--ui); font-weight: 800; font-style: italic; text-transform: uppercase;
            letter-spacing: .06em; font-size: 13px; line-height: 1; padding: 5px 10px 4px; transform: skewX(-12deg); }
        .tag > span { display: inline-block; transform: skewX(12deg); }
        .tag-paper { background: var(--paper); color: var(--ink); }
        .tag-accent { background: var(--accent); color: var(--ink); }
        .tag-pop { background: var(--pop); color: var(--ink); }

        /* ================= CARGA ================= */
        #loading { position: fixed; inset: 0; z-index: 200; background: var(--ink); display: grid; place-items: center; transition: clip-path .7s var(--ease-out); clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%); }
        #loading.gone { clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%); }
        #loading .word { font-family: var(--display); font-size: clamp(48px, 9vw, 120px); transform: skewX(-10deg) rotate(-4deg); color: var(--paper); position: relative; }
        #loading .word::after { content: ''; position: absolute; left: -4%; right: -4%; bottom: 8%; height: 18%; background: var(--accent); z-index: -1; transform-origin: left; animation: loadbar 1s var(--ease-out) infinite alternate; }
        @keyframes loadbar { from { transform: scaleX(.1); } to { transform: scaleX(1); } }

        /* ================= CABECERA ================= */
        #header { position: fixed; top: 0; left: 0; right: 0; height: var(--header-h); z-index: 100; background: var(--ink);
            display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 0 22px;
            clip-path: polygon(0 0, 100% 0, 100% 86%, 62% 100%, 0 90%); padding-bottom: 6px;
            transform: translateY(-100%); transition: transform .6s var(--ease-out); }
        body.ready #header { transform: none; }
        .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .brand-mark { font-family: var(--display); font-size: 22px; background: var(--paper); color: var(--ink); padding: 4px 9px 2px; transform: skewX(-10deg) rotate(-4deg); box-shadow: 4px 4px 0 var(--accent); flex-shrink: 0; }
        .brand-name { font-family: var(--display); font-size: 22px; letter-spacing: .02em; line-height: 1; white-space: nowrap; }
        .brand-sub { font-family: var(--ui); font-style: italic; font-weight: 800; font-size: 13px; color: var(--pop); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
        .contact { display: flex; align-items: center; gap: 20px; }
        .contact a.link { font-family: var(--ui); font-weight: 700; font-size: 16px; text-transform: uppercase; letter-spacing: .04em; display: flex; gap: 8px; align-items: center; transition: color .15s; }
        .contact a.link i { color: var(--accent-ink); background: var(--paper); width: 24px; height: 24px; display: grid; place-items: center; font-size: 12px; transform: rotate(-6deg); }
        .contact a.link:hover { color: var(--pop); }
        .btn-cv { font-family: var(--display); font-size: 18px; letter-spacing: .04em; text-transform: uppercase; background: var(--paper); color: var(--ink);
            padding: 7px 16px 5px; transform: skewX(-12deg); box-shadow: 5px 5px 0 var(--pop); transition: transform .15s var(--ease-snap), box-shadow .15s, background .15s; display: inline-flex; gap: 8px; align-items: center; }
        .btn-cv:hover { transform: skewX(-12deg) translate(-2px, -2px); box-shadow: 8px 8px 0 var(--pop); background: var(--hl); }

        /* ================= FONDO (todo con CSS, colores planos) ================= */
        #stage { position: fixed; top: var(--header-h); bottom: var(--ticker-h); left: 0; right: 0; overflow: hidden; }
        .bg-layer { position: absolute; pointer-events: none; }
        /* trama de puntos */
        .bg-dots { inset: 0; background-image: radial-gradient(var(--accent-d) 1.6px, transparent 2px); background-size: 12px 12px;
            -webkit-mask-image: linear-gradient(115deg, #000 0%, transparent 55%); mask-image: linear-gradient(115deg, #000 0%, transparent 55%); }
        /* placa negra diagonal sobre la que se apoya el tendero */
        .bg-slab { left: -15%; bottom: -35%; width: 75%; height: 85%; background: var(--ink); transform: rotate(-14deg); transition: transform 1s var(--ease-out), left 1s var(--ease-out); }
        .bg-slab2 { left: -10%; bottom: -30%; width: 72%; height: 82%; background: var(--paper); transform: rotate(-10deg); transition: transform 1s var(--ease-out), left 1s var(--ease-out); }
        body.intro-done .bg-slab { left: -38%; transform: rotate(-20deg); }
        body.intro-done .bg-slab2 { left: -33%; transform: rotate(-16deg); }
        /* palabra gigante de fondo */
        .bg-word { right: -2vw; bottom: -6vw; font-family: var(--display); font-size: 26vw; line-height: .8; color: transparent;
            -webkit-text-stroke: 2px rgba(255,255,255,.18); transform: rotate(-8deg); white-space: nowrap; user-select: none; }
        /* franjas que se mueven */
        .bg-stripes { top: 8%; right: -10%; width: 60%; height: 34px; background: repeating-linear-gradient(90deg, rgba(255,255,255,.14) 0 22px, transparent 22px 40px);
            transform: rotate(-8deg); }
        @keyframes stripes { to { background-position: 40px 0; } }

        /* barrido diagonal al terminar la intro */
        #swipe { position: fixed; inset: 0; z-index: 150; pointer-events: none; }
        #swipe::before, #swipe::after { content: ''; position: absolute; top: -20%; bottom: -20%; width: 40%; transform: translateX(-160%) skewX(-18deg); }
        #swipe::before { background: var(--paper); }
        #swipe::after { background: var(--ink); width: 26%; }
        body.swiping #swipe::before { animation: swipe .75s var(--ease-out) forwards; }
        body.swiping #swipe::after { animation: swipe .75s .08s var(--ease-out) forwards; }
        @keyframes swipe { to { transform: translateX(380%) skewX(-18deg); } }

        /* ================= TENDERO + DIALOGO ================= */
        #shopkeeper { position: absolute; z-index: 30; bottom: 18px; left: 50%; transform: translateX(-50%);
            width: min(560px, 44vw); display: flex; flex-direction: column; align-items: center;
            transition: left .9s var(--ease-out), transform .9s var(--ease-out), width .9s var(--ease-out); }
        body.intro-done #shopkeeper { left: 2vw; transform: none; width: min(460px, 30vw); }

        .keeper-art { position: relative; width: 82%; aspect-ratio: 1; cursor: pointer; margin-bottom: -18px; }
        /* rafaga de rayos girando detras */
        .burst { position: absolute; inset: -18%; border-radius: 50%;
            background: repeating-conic-gradient(var(--bg) 0 9deg, var(--bg-d) 9deg 18deg);
            -webkit-mask-image: radial-gradient(circle, #000 35%, transparent 70%); mask-image: radial-gradient(circle, #000 35%, transparent 70%);
            animation: spin 40s linear infinite; }
        body.intro-done .burst { opacity: .9; }
        @keyframes spin { to { transform: rotate(360deg); } }
        /* tu silueta: ya trae su propio contorno, solo le anadimos la sombra plana negra */
        .keeper-img { position: relative; width: 100%; height: 100%; object-fit: contain; object-position: bottom;
            filter: drop-shadow(10px 10px 0 var(--ink)); transition: transform .5s var(--ease-snap); transform-origin: bottom center; }
        .keeper-art { margin-bottom: -46px; width: 98%; }
        @keyframes bob { 0%, 100% { translate: 0 0; } 50% { translate: 0 -10px; } }

        .dialogue { position: relative; width: 100%; cursor: pointer; }
        .dialogue-shadow { position: absolute; inset: 0; background: var(--ink); transform: translate(9px, 9px) rotate(1.2deg);
            clip-path: polygon(1% 6%, 99% 0, 100% 92%, 2% 100%); }
        .dialogue-box { position: relative; background: var(--paper); color: var(--ink); padding: 26px 30px 22px; min-height: 120px;
            clip-path: polygon(1% 6%, 99% 0, 100% 92%, 2% 100%); }
        .dialogue-box::before { content: ''; position: absolute; inset: 6px; border: 3px solid var(--ink); clip-path: polygon(1% 6%, 99% 0, 100% 92%, 2% 100%); pointer-events: none; }
        #dialogueText { font-family: var(--ui); font-weight: 700; font-size: 21px; line-height: 1.2; margin: 0; min-height: 3.6em; }
        .nametag { position: absolute; z-index: 2; top: -18px; left: 18px; font-family: var(--display); font-size: 20px; letter-spacing: .04em;
            background: var(--ink); color: var(--paper); padding: 6px 16px 4px; transform: skewX(-14deg) rotate(-3deg); box-shadow: 5px 5px 0 var(--pop); }
        .nametag span { display: inline-block; transform: skewX(14deg); }
        .next { position: absolute; right: 22px; bottom: 14px; width: 0; height: 0; border-left: 9px solid transparent; border-right: 9px solid transparent; border-top: 12px solid var(--pop); animation: blink 1s steps(2) infinite; }
        @keyframes blink { 50% { opacity: 0; } }

        /* ================= MERCANCIA (ficha + estanteria) ================= */
        #goods { position: absolute; top: 20px; bottom: 24px; right: 2.5vw; width: 63vw; z-index: 20;
            display: grid; grid-template-columns: 1fr 1.08fr; gap: 34px; pointer-events: none; }
        .card { position: relative; pointer-events: auto; opacity: 0; transform: translateX(70vw) rotate(6deg);
            transition: transform .85s var(--ease-snap), opacity .4s ease; min-height: 0; }
        .card:nth-child(2) { transition-delay: .1s; }
        body.goods-in .card { opacity: 1; transform: rotate(var(--tilt, 0deg)); }
        body.panel-open .card { opacity: 0; transform: translateX(40vw) rotate(4deg); pointer-events: none; transition-delay: 0s; }

        /* forma del panel: borde blanco + sombra desplazada de color */
        .card { --shape: polygon(0 1.5%, 97% 0, 100% 98%, 2.5% 100%); }
        .card::before { content: ''; position: absolute; inset: 0; background: var(--sh, var(--ink)); clip-path: var(--shape); transform: translate(12px, 12px); }
        /* hover: solo resalta el bloque (la sombra se ilumina), sin moverlo ni expandirlo; el clic es lo que expande */
        .card::before { transition: background .2s ease; }
        .card:hover::before { background: var(--pop); }
        #sheet, #shelf { cursor: pointer; }
        #sheet.is-open, #shelf.is-open { cursor: default; }
        .card-frame { position: relative; height: 100%; background: var(--frame, var(--paper)); clip-path: var(--shape); padding: 5px; }
        .card-inner { height: 100%; background: var(--fill, var(--ink)); clip-path: var(--shape); display: flex; flex-direction: column; min-height: 0; }
        .card-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 24px 22px; scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }

        /* --- ficha de personaje (negra) --- */
        #sheet { --tilt: -1.2deg; }
        .sheet-head { padding: 20px 24px 8px; position: relative; }
        .sheet-name { font-family: var(--display); font-size: clamp(30px, 3vw, 48px); line-height: .9; margin: 8px 0 8px; transform: skewX(-6deg); white-space: nowrap; }
        .sheet-name em { font-style: normal; color: var(--accent); -webkit-text-stroke: 0; }
        .pitch { font-size: 13.5px; line-height: 1.45; color: #d9dbe4; margin: 0 0 4px; }
        .sec { margin-top: 10px; }
        .sec-title { font-family: var(--ui); font-style: italic; font-weight: 900; font-size: 15px; letter-spacing: .1em; text-transform: uppercase; color: var(--pop);
            display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        .sec-title::after { content: ''; flex: 1; height: 3px; background: linear-gradient(90deg, var(--pop), transparent); transform: skewX(-30deg); }
        .roles { display: grid; gap: 8px; }
        .role { background: var(--paper); color: var(--ink); padding: 7px 12px 7px; clip-path: polygon(0 0, 100% 6%, 98.5% 100%, 1% 94%); display: flex; align-items: baseline; gap: 10px; }
        .role h4 { font-family: var(--display); font-size: 18px; margin: 0; line-height: 1; white-space: nowrap; }
        .role ul { margin: 0; padding: 0; list-style: none; font-size: 12.5px; font-weight: 600; line-height: 1.35; }
        .role li { display: inline; }
        .role li + li::before { content: ' / '; color: var(--accent-ink); font-weight: 800; }

        .chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .chip { font-family: var(--ui); font-weight: 700; font-size: 14px; text-transform: uppercase; letter-spacing: .03em; border: 2px solid var(--paper); padding: 1px 8px; transform: skewX(-10deg); }
        .facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; font-size: 13px; line-height: 1.4; }
        .facts li { display: flex; gap: 10px; }
        .facts i { background: var(--accent); color: var(--ink); width: 22px; height: 22px; flex-shrink: 0; display: grid; place-items: center; font-size: 11px; transform: rotate(-6deg); }
        .awards { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: aw; }
        .awards li { counter-increment: aw; display: flex; gap: 10px; font-size: 13px; line-height: 1.35; }
        .awards li::before { content: counter(aw, decimal-leading-zero); font-family: var(--display); font-size: 18px; color: var(--hl); line-height: 1; min-width: 24px; }
        .awards small { color: #9aa0b4; font-size: 12px; }

        /* --- estanteria (blanca) --- */
        #shelf { --tilt: 1deg; --frame: var(--ink); --fill: var(--paper); --sh: var(--ink); color: var(--ink); }
        #shelf .card-scroll { padding-top: 18px; scrollbar-color: var(--ink) transparent; }
        #shelfBody > * { flex-shrink: 0; }
        .shelf-title { font-family: var(--display); font-size: 22px; letter-spacing: .03em; display: flex; align-items: center; gap: 10px; margin: 14px 0 8px; }
        .shelf-title:first-child { margin-top: 0; }
        .shelf-title .tag { font-size: 12px; }
        .shelf-title::after { content: ''; flex: 1; height: 4px; background: var(--ink); transform: skewX(-30deg); }

        .item { position: relative; display: block; overflow: hidden; background: var(--ink); border: 3px solid var(--ink);
            transition: transform .2s var(--ease-snap), box-shadow .2s; box-shadow: 0 0 0 var(--accent); }
        .item:hover, .item:focus-visible { transform: translate(-3px, -4px) rotate(-1deg); box-shadow: 7px 8px 0 var(--accent); outline: none; z-index: 2; }
        .item > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .5s var(--ease-out), filter .3s; }
        .item:hover > img.bg { transform: scale(1.07); }
        .item .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,10,12,.92), rgba(10,10,12,.15) 55%, transparent); }
        .item .year { position: absolute; top: 7px; left: 7px; z-index: 2; }

        .featured { height: 172px; }
        .featured .info { position: absolute; inset: auto 0 0 0; z-index: 2; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .featured .logo { height: 44px; width: auto; align-self: flex-start; filter: drop-shadow(2px 2px 0 var(--ink)); }
        .featured .role-line { font-family: var(--ui); font-weight: 800; font-style: italic; font-size: 14px; color: var(--hl); text-transform: uppercase; letter-spacing: .04em; line-height: 1; }
        .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
        .stat { background: var(--paper); color: var(--ink); padding: 4px 6px 3px; transform: skewX(-8deg); line-height: 1; }
        .stat b { display: block; font-family: var(--display); font-weight: 400; font-size: 22px; transform: skewX(8deg); }
        .stat span { display: block; font-family: var(--ui); font-weight: 800; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; transform: skewX(8deg); }


        .article { display: flex; gap: 10px; align-items: center; padding: 6px; background: var(--paper); border: 3px solid var(--ink); color: var(--ink);
            transition: transform .2s var(--ease-snap), box-shadow .2s, background .2s, color .2s; }
        .article:hover, .article:focus-visible { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 var(--pop); background: var(--ink); color: var(--paper); outline: none; }
        .article img { width: 54px; height: 54px; object-fit: cover; border: 2px solid var(--ink); flex-shrink: 0; }
        .article b { display: block; font-family: var(--ui); font-weight: 800; font-size: 16px; line-height: 1.05; text-transform: uppercase; }
        .article small { font-family: var(--ui); font-weight: 700; font-size: 13px; text-transform: uppercase; color: var(--accent-ink); letter-spacing: .04em; }


        /* ================= PANEL DE DETALLE ================= */
        #panel { position: fixed; z-index: 90; top: var(--header-h); bottom: var(--ticker-h); right: 0; width: 64vw; background: var(--ink);
            clip-path: polygon(6% 0, 100% 0, 100% 100%, 0 100%); display: flex; flex-direction: column;
            transform: translateX(105%); transition: transform .6s var(--ease-out); }
        body.panel-open #panel { transform: none; }
        #panel::before { content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 7%; background: var(--paper); clip-path: polygon(86% 0, 100% 0, 14% 100%, 0 100%); z-index: 2; pointer-events: none; }
        #panelBody { flex: 1; overflow-y: auto; padding: 18px 32px 24px 9%; font-size: 15px; line-height: 1.6; color: #e3e5ee; scrollbar-width: thin; scrollbar-color: var(--accent) transparent; }
        .panel-foot { padding: 12px 32px 14px 9%; display: flex; gap: 12px; justify-content: flex-end; border-top: 3px solid var(--paper); }
        .btn-back { font-family: var(--display); font-size: 18px; letter-spacing: .04em; background: var(--paper); color: var(--ink); padding: 7px 18px 5px; transform: skewX(-12deg); box-shadow: 5px 5px 0 var(--pop); display: inline-flex; gap: 10px; align-items: center; }
        .btn-back:hover { background: var(--hl); }
        .btn-link { font-family: var(--ui); font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: .04em; background: var(--accent); color: var(--ink);
            padding: 7px 14px 6px; transform: skewX(-12deg); display: inline-block; box-shadow: 4px 4px 0 var(--paper); transition: box-shadow .15s, transform .15s; }
        .btn-link:hover { transform: skewX(-12deg) translate(-2px, -2px); box-shadow: 6px 6px 0 var(--pop); }
        .back-mini { font-family: var(--ui); font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--hl); margin-bottom: 12px; display: inline-block; }
        .proj-card { position: relative; display: block; width: 100%; height: 150px; overflow: hidden; border: 3px solid var(--paper); text-align: left; margin-bottom: 14px; transition: transform .2s var(--ease-snap), box-shadow .2s; }
        .proj-card:hover { transform: translate(-3px, -3px) rotate(-.6deg); box-shadow: 8px 8px 0 var(--accent); }
        .proj-card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        .proj-card .shade { position: absolute; inset: 0; background: linear-gradient(to top, rgba(10,10,12,.95), transparent 70%); }
        .proj-card .txt { position: absolute; inset: auto 0 0 0; padding: 12px; }
        .proj-card .txt h3 { font-family: var(--display); font-size: 24px; margin: 0; line-height: 1; }
        .proj-card .txt p { margin: 4px 0 0; font-size: 13px; color: #d9dbe4; }

        /* ================= VERSION CORTA / EXPANDIDA =================
           .less  = lo que se ve de primeras (poca info, mas grande)
           .more  = la version completa, a dos columnas, cuando el cuadro se expande
           hover        -> el cuadro solo se resalta (sombra azul clara), no cambia de tamano
           body.focus-* -> al hacer clic, ese cuadro se expande y empuja al otro a una tira */
        .pitch.big { font-size: 16px; line-height: 1.5; color: var(--paper); margin-bottom: 14px; }
        .expand-btn { margin-top: 18px; align-self: flex-start; display: inline-flex; gap: 10px; align-items: center; font-family: var(--display); font-size: 18px; letter-spacing: .04em;
            background: var(--accent); color: var(--ink); padding: 7px 18px 5px; transform: skewX(-12deg); box-shadow: 5px 5px 0 var(--paper); transition: transform .15s var(--ease-snap), box-shadow .15s; }
        .expand-btn:hover { transform: skewX(-12deg) translate(-2px, -2px); box-shadow: 8px 8px 0 var(--pop); }
        #shelf .expand-btn { box-shadow: 5px 5px 0 var(--ink); }
        .less { display: flex; flex-direction: column; }
        .more { display: none; }

        .sheet-full { grid-template-columns: 1fr 1fr; gap: 30px; }
        .shelf-full { grid-template-columns: 1fr 1.1fr; gap: 24px; }
        .featured.tall { height: 240px; }

        .card-toggle { position: absolute; z-index: 5; top: 14px; right: 22px; width: 38px; height: 38px; display: grid; place-items: center; font-size: 16px;
            background: var(--accent); color: var(--ink); transform: skewX(-10deg) rotate(4deg); box-shadow: 4px 4px 0 var(--paper); transition: transform .2s var(--ease-snap); }
        #shelf .card-toggle { box-shadow: 4px 4px 0 var(--ink); }
        .card-toggle:hover { transform: skewX(-10deg) rotate(4deg) scale(1.12); }
        .card-toggle i { transition: transform .3s var(--ease-snap); }
        /* boton de la esquina: "+" para expandir; con el bloque abierto se convierte en un "Back to main" bien visible */
        .card-toggle .ic-back, .card-toggle .t-back { display: none; }
        .card.is-open .card-toggle { width: auto; height: auto; padding: 9px 18px 7px; gap: 10px; display: flex; align-items: center; font-family: var(--display); font-size: 19px; letter-spacing: .04em; text-transform: uppercase;
            background: var(--paper); color: var(--ink); box-shadow: 5px 5px 0 var(--accent); transform: skewX(-10deg); }
        .card.is-open .card-toggle:hover { background: var(--hl); transform: skewX(-10deg) translate(-2px, -2px); box-shadow: 8px 8px 0 var(--accent); }
        .card.is-open .card-toggle .ic-open { display: none; }
        .card.is-open .card-toggle .ic-back, .card.is-open .card-toggle .t-back { display: inline; }

        /* tira vertical cuando el cuadro queda empujado */
        .mini-label { position: absolute; inset: 0; z-index: 4; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            opacity: 0; pointer-events: none; transition: opacity .3s; cursor: pointer; }
        .mini-label span { font-family: var(--display); font-size: 40px; letter-spacing: .04em; writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
        .mini-label i { font-size: 20px; background: var(--accent); color: var(--ink); width: 40px; height: 40px; display: grid; place-items: center; transform: skewX(-10deg); }
        #shelf .mini-label { color: var(--ink); }

        @media (min-width: 1024px) {
            #goods { grid-template-columns: 1fr 1fr; transition: grid-template-columns .7s var(--ease-out); }
            .card { min-width: 0; }
            body.focus-sheet #goods { grid-template-columns: 1fr .19fr; }
            body.focus-shelf #goods { grid-template-columns: .19fr 1fr; }
            .card.is-open .less { display: none; }
            .card.is-open .more { display: grid; animation: moreIn .45s .25s both; }
            .card .sheet-head, .card .card-scroll { transition: opacity .25s; }
            .card.is-mini .sheet-head, .card.is-mini .card-scroll, .card.is-mini .card-toggle { opacity: 0; pointer-events: none; }
            .card.is-mini .mini-label { opacity: 1; pointer-events: auto; transition-delay: .25s; }
            .card.is-mini { cursor: pointer; }
        }
        @keyframes moreIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

        /* ================= NAVEGACION DE SECCIONES (cabecera) ================= */
        /* izquierda: logo + partes de la pagina | derecha (empujado con margin-left:auto): contacto */
        .sections { display: flex; gap: 4px; margin-left: 22px; padding-left: 18px; border-left: 3px solid rgba(255,255,255,.18); margin-right: auto; }
        .sections a.ext .ext-ico { font-size: 10px; color: var(--paper); opacity: .7; }
        .contact { margin-left: auto; padding-left: 18px; }
        .sections a { font-family: var(--display); font-size: 17px; letter-spacing: .05em; text-transform: uppercase; padding: 6px 13px 4px;
            transform: skewX(-12deg); display: flex; gap: 8px; align-items: center; transition: background .15s, color .15s; }
        .sections a > * { transform: skewX(12deg); }
        .sections a i { color: var(--pop); font-size: 14px; }
        .sections a:hover { background: var(--paper); color: var(--ink); }
        .sections a:hover i { color: var(--accent-ink); }
        body.focus-sheet .sections a[data-nav=cv], body.focus-shelf .sections a[data-nav=projects], body.focus-writings .sections a[data-nav=writings] { background: var(--accent); color: var(--ink); }
        body.focus-sheet .sections a[data-nav=cv] i, body.focus-shelf .sections a[data-nav=projects] i, body.focus-writings .sections a[data-nav=writings] i { color: var(--ink); }
        .card.flash { animation: flash .8s var(--ease-snap); }
        @keyframes flash { 25% { translate: 0 -12px; } 55% { translate: 0 2px; } }

        /* ================= COLUMNA IZQUIERDA: CV + WRITINGS ================= */
        .col-left { display: flex; flex-direction: column; gap: 26px; min-height: 0; min-width: 0; }
        #sheet { flex: 1 1 auto; min-height: 0; }
        #writings { flex: 0 0 auto; --tilt: .8deg; --frame: var(--ink); --fill: var(--paper); --sh: var(--ink); color: var(--ink); }
        #writings .card-frame { height: auto; }
        #writings .card-scroll { padding: 14px 22px 16px; max-height: 170px; scrollbar-color: var(--ink) transparent; }
        #writings .shelf-title { margin: 0 0 8px; font-size: 20px; }
        #writingsBody { display: flex; flex-direction: column; gap: 6px; }
        body.focus-shelf #writings { opacity: 0; pointer-events: none; }

        /* ================= BANNERS DE PROYECTOS (estilo Project Vault) ================= */
        .banners { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .banner { position: relative; display: block; height: 58px; flex-shrink: 0; overflow: hidden; border: 3px solid var(--ink); background: var(--ink); color: var(--paper);
            transition: transform .2s var(--ease-snap), box-shadow .2s; }
        .banner:hover, .banner:focus-visible { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 var(--accent); outline: none; z-index: 2; }
        .banner .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%; transition: transform .5s var(--ease-out); }
        .banner:hover .bg { transform: scale(1.05); }
        .banner .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,10,12,.94) 0%, rgba(10,10,12,.6) 45%, rgba(10,10,12,.05) 85%); }
        .banner .b-txt { position: absolute; inset: 0 46px 0 12px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
        .banner .b-meta { display: flex; align-items: center; gap: 10px; }
        .banner .tag { font-size: 11px; padding: 3px 7px 2px; }
        .banner .b-tags { font-family: var(--ui); font-weight: 800; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--hl); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .banner h4 { font-family: var(--display); font-weight: 400; font-size: 22px; margin: 0; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .banner h4 i { font-size: 13px; vertical-align: middle; }
        .banner p { margin: 0; font-size: 12.5px; line-height: 1.35; color: #d9dbe4; max-width: 88%; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .banner .b-go { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: var(--paper); color: var(--ink); width: 26px; height: 26px; display: grid; place-items: center; font-size: 12px; }
        .banner:hover .b-go { background: var(--accent); color: var(--ink); }
        .banner.ext { height: 44px; }
        .banner.ext .b-meta { display: none; }
        .banner.big { height: 116px; }
        .banner.big.ext { height: 70px; }

        /* ================= DIALOGO ESTILO RPG (escritorio) =================
           La barra de dialogo cruza toda la pantalla abajo. La silueta va delante, apoyada en ella,
           y al terminar la intro se hace pequena y se pone a la izquierda. La info queda detras,
           siempre por encima de la barra, asi que nunca queda tapada. */
        @media (min-width: 1024px) {
            :root { --dlg-h: 124px; }
            #shopkeeper, body.intro-done #shopkeeper { position: absolute; inset: 0; left: 0; width: auto; transform: none; display: block; pointer-events: none; z-index: 40; }
            #shopkeeper .keeper-art { position: absolute; margin: 0; width: auto; height: 84%; aspect-ratio: 1; left: 50%; bottom: calc(var(--dlg-h) - 46px);
                transform: translateX(-50%); pointer-events: auto; z-index: 1;
                transition: left .9s var(--ease-out), transform .9s var(--ease-out), height .9s var(--ease-out); }
            body.intro-done #shopkeeper .keeper-art { left: -1.5vw; transform: none; height: 70%; }
            /* los rayos solo durante la intro: luego se apagan para no tapar la ficha */
            .burst { transition: opacity .6s ease; }
            body.intro-done .burst { opacity: 0; }
            /* version corta de la estanteria algo mas compacta para que quepa encima de la barra */
            .less .featured { height: 150px; }
            .less .shelf-title { margin: 10px 0 6px; font-size: 20px; }
            .less .expand-btn { margin-top: 14px; }
            #shopkeeper .dialogue { position: absolute; left: 2.5vw; right: 2.5vw; bottom: 16px; width: auto; z-index: 2; pointer-events: auto; }
            .dialogue-box { min-height: var(--dlg-h); padding: 30px 44px 22px; }
            #dialogueText { font-size: 23px; min-height: 2.4em; max-width: 1150px; }
            .nametag { left: 36px; font-size: 22px; }
            #goods { bottom: calc(var(--dlg-h) + 40px); width: 72vw; }
            #panel { bottom: calc(var(--dlg-h) + 34px); width: 72vw; }
        }

        /* ajustes de altura para que en portatil todo quepa sin scroll (van al final para mandar) */
        #writings .card-scroll { padding: 12px 20px 8px; }
        #writings .shelf-title { font-size: 18px; margin-bottom: 6px; }
        #writings .article { padding: 4px; }
        #writings .article img { width: 38px; height: 38px; }
        #writings .article > span { min-width: 0; }
        #writings .article b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15px; }
        #writings .card-scroll { max-height: 210px; }
        .col-left { gap: 18px; }
        /* CV expandido: ocupa toda la columna y Writings se aparta mientras tanto */
        body.focus-sheet #writings { display: none; }
        .sheet-head { padding-top: 14px; }
        .sheet-name { margin: 2px 0 6px; }

        /* CV corto = solo una presentacion de quien soy; Writings ocupa el resto de la columna */
        .pitch.big { font-size: 17px; line-height: 1.55; margin-bottom: 0; }
        #writings .article { align-items: flex-start; }
        #writings .article img { width: 52px; height: 52px; }
        @media (min-width: 1024px) {
            #sheet { flex: 0 0 auto; }
            #writings { flex: 1 1 auto; min-height: 0; }
            #writings .card-frame { height: 100%; }
            #writings .card-scroll { max-height: none; }

            /* CV expandido: crece hasta ocupar casi toda la pagina (ancho y alto).
               Proyectos y la silueta se apartan mientras tanto; la barra de dialogo se queda. */
            #goods { transition: grid-template-columns .7s var(--ease-out), width .7s var(--ease-out), gap .7s var(--ease-out); }
            body.focus-sheet #goods { width: 95vw; grid-template-columns: 1fr 0fr; gap: 0; }
            body.focus-sheet #shelf { opacity: 0; pointer-events: none; }
            body.focus-sheet #sheet { flex: 1 1 auto; }
            #shopkeeper .keeper-art { transition: left .9s var(--ease-out), transform .9s var(--ease-out), height .9s var(--ease-out), opacity .4s ease; }
            body.focus-sheet #shopkeeper .keeper-art { opacity: 0; pointer-events: none; }
            body.focus-sheet .sheet-full { grid-template-columns: 1.15fr 1fr 1fr; gap: 36px; }
            body.focus-sheet .sheet-name { font-size: 56px; }
        }
        .less .featured { height: 132px; }
        .less .shelf-title:first-child { margin-top: 0; }
        .banner { height: 46px; }
        .banner.ext { height: 38px; }
        .banner .b-txt { flex-direction: row; align-items: center; justify-content: flex-start; gap: 10px; }
        .banner.big { height: 116px; }
        .banner.big.ext { height: 64px; }
        .banner.big .b-txt { flex-direction: column; align-items: flex-start; justify-content: center; gap: 4px; }
        .banners { gap: 6px; }
        /* banners con logo que se reparten todo el alto del bloque */
        #shelf .less { flex: 1 1 auto; min-height: 0; }
        .less .banners { flex: 1 1 auto; min-height: 0; }
        .less .banner { height: auto; flex: 1 1 0; min-height: 56px; }
        .banner .b-logo { height: 74%; max-height: 72px; width: auto; max-width: 62%; object-fit: contain; object-position: left center; filter: drop-shadow(2px 2px 0 var(--ink)); }
        .banner.big .b-logo { height: 44px; max-height: 44px; }
        .banner .b-txt h4 { font-size: 24px; }
        .pitch.big { font-size: 15px; margin-bottom: 4px; }
        .less .expand-btn { margin-top: 12px; }

        /* ================= VISTA AMPLIADA (juegos, articulos, vault) =================
           Ocupa el mismo espacio grande que el CV expandido. La barra de dialogo se queda. */
        /* boton grande para volver: fijo arriba a la izquierda, no se va al hacer scroll */
        .panel-back { position: absolute; z-index: 5; top: 16px; right: 22px; display: flex; align-items: center; gap: 10px;
            font-family: var(--display); font-size: 21px; letter-spacing: .04em; text-transform: uppercase; padding: 10px 20px 8px;
            background: var(--paper); color: var(--ink); transform: skewX(-10deg); box-shadow: 6px 6px 0 var(--accent);
            transition: transform .15s var(--ease-snap), box-shadow .15s, background .15s; }
        .panel-back:hover { background: var(--hl); transform: skewX(-10deg) translate(-2px, -2px); box-shadow: 9px 9px 0 var(--accent); }
        .panel-back kbd { font-family: var(--ui); font-weight: 800; font-size: 12px; background: var(--ink); color: var(--paper); padding: 2px 6px; letter-spacing: .06em; }
        /* boton de volver tambien al final del contenido */
        .end-back { display: flex; justify-content: center; padding: 30px 32px 6px; }
        #panelBody { padding: 0 0 24px !important; }
        .d-hero { position: relative; height: 260px; overflow: hidden; border-bottom: 5px solid var(--paper); }
        .d-hero.art { height: 240px; }
        .d-hero .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 30%; }
        .d-hero .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(10,10,12,.95) 0%, rgba(10,10,12,.7) 45%, rgba(10,10,12,.1) 100%); }
        .d-hero-txt { position: absolute; left: 32px; right: 32px; bottom: 22px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
        .d-meta { display: flex; flex-wrap: wrap; gap: 8px; }
        .d-logo { height: 88px; width: auto; max-width: 60%; object-fit: contain; filter: drop-shadow(3px 3px 0 var(--ink)); }
        .d-title { font-family: var(--display); font-weight: 400; font-size: clamp(34px, 3.4vw, 54px); line-height: .95; margin: 0; transform: skewX(-6deg); max-width: 900px; }
        .d-sum { margin: 0; max-width: 620px; font-size: 15px; color: #d9dbe4; }
        .d-grid { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 36px; padding: 26px 32px 0; }
        .d-main p { margin: 0 0 12px; }
        .d-h { font-family: var(--display); font-weight: 400; font-size: 28px; margin: 22px 0 12px; display: flex; align-items: center; gap: 12px; }
        .d-h:first-child { margin-top: 0; }
        .d-h::after { content: ''; flex: 1; height: 4px; background: linear-gradient(90deg, var(--accent), transparent); transform: skewX(-30deg); }
        .d-main video { width: 100%; border: 4px solid var(--paper); box-shadow: 8px 8px 0 var(--accent); margin: 10px 0 6px; }
        .contrib { background: #15161c; border-left: 6px solid var(--accent); padding: 16px 18px; margin-bottom: 14px; }
        .contrib h4 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0 0 8px; color: var(--paper); }
        .contrib ul { margin: 0 0 10px; padding-left: 18px; }
        .contrib li { margin-bottom: 4px; }
        .contrib li::marker { color: var(--pop); }
        .contrib .note { font-style: italic; color: var(--hl); border-left: 3px solid var(--pop); padding-left: 12px; }
        .hl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 10px; }
        .hl { background: var(--paper); color: var(--ink); padding: 10px 12px; clip-path: polygon(0 0, 100% 3%, 98% 100%, 1% 97%); }
        .hl b { display: block; font-family: var(--ui); font-weight: 900; font-style: italic; text-transform: uppercase; font-size: 15px; color: var(--accent-ink); }
        .hl span { font-size: 13px; line-height: 1.4; }
        .shots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .shots img { width: 100%; border: 3px solid var(--paper); }
        .d-soon { font-family: var(--ui); font-weight: 800; font-size: 20px; text-transform: uppercase; color: var(--pop); }
        .d-side { display: flex; flex-direction: column; gap: 18px; align-self: start; position: sticky; top: 0; }
        .d-side .stats { grid-template-columns: 1fr; }
        .d-side .stat { padding: 8px 12px; }
        .d-side .stat b { font-size: 30px; }
        .d-facts { margin: 0; background: #15161c; padding: 14px 16px; display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; font-size: 13.5px; }
        .d-facts dt { font-family: var(--ui); font-weight: 800; text-transform: uppercase; color: var(--pop); letter-spacing: .04em; }
        .d-facts dd { margin: 0; }
        .d-links { display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
        /* articulo: columna de lectura */
        .prose { max-width: 760px; margin: 0 auto; padding: 28px 32px 0; font-size: 17px; line-height: 1.75; color: #e3e5ee; }
        .prose h3 { font-family: var(--display); font-weight: 400; font-size: 30px; line-height: 1; color: var(--paper); margin: 30px 0 12px; }
        .prose h3:first-child { margin-top: 0; }
        .prose p { margin: 0 0 16px; }
        .prose em { color: var(--paper); }
        .prose blockquote { margin: 24px 0; padding: 16px 22px; background: var(--paper); color: var(--ink); font-family: var(--ui); font-weight: 800; font-style: italic; font-size: 23px; line-height: 1.25;
            transform: skewX(-4deg); box-shadow: 8px 8px 0 var(--accent); }
        .prose blockquote em { color: var(--ink); }
        .prose figure { margin: 24px 0; }
        .prose figure img { width: 100%; border: 4px solid var(--paper); }
        .prose figcaption { font-size: 13px; color: #9aa0b4; margin-top: 6px; }
        .prose code { background: #15161c; padding: 1px 6px; }
        .more-reads { padding-top: 10px; }
        .more-reads .article { width: 100%; text-align: left; margin-bottom: 10px; }
        .vault-head { padding: 26px 32px 6px; }
        .vault-head .d-title { margin-top: 10px; }
        .vault-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; padding: 14px 32px 0; }
        .vault-grid .proj-card { margin: 0; }
        @media (min-width: 1024px) {
            #panel { left: 2.5vw; right: 2.5vw; width: auto !important; top: calc(var(--header-h) + 20px); bottom: calc(var(--dlg-h) + 40px);
                clip-path: none; border: 5px solid var(--paper); box-shadow: 12px 12px 0 var(--ink);
                opacity: 0; pointer-events: none; transform: translateY(40px) scale(.96); transition: transform .5s var(--ease-snap), opacity .3s ease; }
            body.panel-open #panel { opacity: 1; pointer-events: auto; transform: none; }
            #panel::before { display: none; }
            body.panel-open #shopkeeper .keeper-art { opacity: 0; pointer-events: none; }
            /* en escritorio se cierra con la X (o Esc): la barra inferior sobra y quita espacio */
            #panel .panel-foot { display: none; }
            .d-hero { height: 210px; }
            .d-hero.art { height: 200px; }
            .d-logo { height: 76px; }
        }
        @media (max-width: 1023px) {
            .d-grid { grid-template-columns: 1fr; padding: 20px 18px 0; }
            .d-side { position: static; }
            .d-hero { height: 220px; }
            .d-hero-txt { left: 18px; right: 18px; }
            .d-logo { height: 60px; }
            .prose { padding: 22px 18px 0; font-size: 16px; }
            .vault-grid { padding: 14px 18px 0; }
            .shots { grid-template-columns: 1fr; }
        }

        /* ================= WRITINGS: lista corta + bloque ampliado =================
           Corta: titulo, tematica (una palabra) y tiempo de lectura.
           Ampliada (clic en el bloque): tarjetas con imagen, fecha y resumen. Clic en un articulo: se lee a pantalla grande. */
        .w-list { display: flex; flex-direction: column; gap: 8px; }
        /* miniatura del articulo: a diferencia de los banners de juegos (imagen de fondo a todo el ancho),
           aqui es una pequena ilustracion tipo "foto pegada": cuadrada, con borde, ligeramente girada */
        .w-thumb { flex-shrink: 0; width: 58px; height: 58px; background: var(--paper); padding: 3px; border: 3px solid var(--ink);
            box-shadow: 4px 4px 0 var(--accent); transform: rotate(-4deg); transition: transform .25s var(--ease-snap), box-shadow .2s; }
        .w-row:nth-child(even) .w-thumb { transform: rotate(3deg); }
        .w-thumb img { width: 100%; height: 100%; object-fit: cover; }
        .w-row:hover .w-thumb { transform: rotate(0deg) scale(1.08); box-shadow: 5px 5px 0 var(--pop); }
        .w-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; background: var(--paper); color: var(--ink); border: 3px solid var(--ink);
            transition: transform .2s var(--ease-snap), box-shadow .2s, background .2s, color .2s; }
        .w-row:hover, .w-row:focus-visible { transform: translate(-3px, -3px); box-shadow: 6px 6px 0 var(--accent); background: var(--ink); color: var(--paper); outline: none; }
        /* sin la etiqueta de tematica, el titulo tiene sitio para hasta 2 lineas */
        .w-row b { flex: 1; min-width: 0; font-family: var(--ui); font-weight: 800; font-size: 16px; text-transform: uppercase; line-height: 1.1;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .w-row .tag { font-size: 11px; flex-shrink: 0; }
        .w-time { flex-shrink: 0; font-family: var(--ui); font-weight: 800; font-size: 13px; text-transform: uppercase; color: var(--accent-ink); white-space: nowrap; }
        .w-row:hover .w-time { color: var(--pop); }
        .w-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; align-items: start; }
        .w-card { display: flex; flex-direction: column; background: var(--ink); color: var(--paper); border: 3px solid var(--ink);
            transition: transform .2s var(--ease-snap), box-shadow .2s; }
        .w-card:hover, .w-card:focus-visible { transform: translate(-3px, -4px); box-shadow: 8px 8px 0 var(--accent); outline: none; }
        .w-card img { width: 100%; height: 160px; object-fit: cover; border-bottom: 3px solid var(--ink); }
        .w-card .w-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
        .w-card h4 { font-family: var(--display); font-weight: 400; font-size: 24px; line-height: 1; margin: 0; }
        .w-card p { margin: 0; font-size: 13.5px; line-height: 1.45; color: #d9dbe4; }
        .w-card .w-read { font-family: var(--ui); font-weight: 800; font-size: 14px; text-transform: uppercase; color: var(--pop); }
        #writings .card-toggle { box-shadow: 4px 4px 0 var(--ink); }
        /* scroll dentro de Writings: la cabecera se queda fija arriba y la barra se ve clara */
        #writings:not(.is-open) .shelf-title { position: sticky; top: -22px; z-index: 3; background: var(--paper); margin: -22px -20px 8px; padding: 22px 20px 8px; }
        #writings .card-scroll { scrollbar-width: thin; scrollbar-color: var(--ink) #e6e8ee; overscroll-behavior: contain; }
        #writings .card-scroll::-webkit-scrollbar { width: 8px; }
        #writings .card-scroll::-webkit-scrollbar-track { background: #e6e8ee; }
        #writings .card-scroll::-webkit-scrollbar-thumb { background: var(--ink); }
        #writings .card-scroll { padding-top: 16px; }
        @media (min-width: 1024px) {
            /* Writings ampliado: igual que el CV, ocupa casi toda la pagina */
            body.focus-writings #goods { width: 95vw; grid-template-columns: 1fr 0fr; gap: 0; }
            body.focus-writings #shelf { opacity: 0; pointer-events: none; }
            body.focus-writings #sheet { display: none; }
            body.focus-writings #writings { flex: 1 1 auto; }
            body.focus-writings #shopkeeper .keeper-art { opacity: 0; pointer-events: none; }
            body.focus-writings #writings .shelf-title { font-size: 30px; margin-bottom: 16px; }

            /* Projects ampliado: tambien a pagina completa (la columna del CV desaparece en vez de quedar como tira) */
            body.focus-shelf #goods { width: 95vw; grid-template-columns: 0fr 1fr; gap: 0; }
            body.focus-shelf .col-left { opacity: 0; visibility: hidden; pointer-events: none; overflow: hidden; }
            body.focus-shelf #shopkeeper .keeper-art { opacity: 0; pointer-events: none; }
            body.focus-shelf .shelf-full { grid-template-columns: minmax(0, 1fr) minmax(0, 1.7fr); gap: 30px; }
            body.focus-shelf .shelf-full .banners { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
            body.focus-shelf .featured.tall { height: 280px; }
            /* boton de la esquina en reposo: "+ READ MORE" para que se entienda que se puede ampliar */
            .card-toggle { width: auto; height: auto; padding: 8px 14px 6px 12px; display: flex; align-items: center; gap: 8px; }
            .card-toggle .t-more { font-family: var(--display); font-size: 15px; letter-spacing: .05em; text-transform: uppercase; white-space: nowrap; }
            .card.is-open .card-toggle .t-more { display: none; }
            /* en el CV el texto largo chocaria con el nombre: en reposo va abajo a la derecha */
            #sheet:not(.is-open) .card-toggle { top: auto; bottom: 20px; }
            #sheet:not(.is-open) .card-scroll { padding-bottom: 66px; }
            /* en reposo el boton es algo mas compacto para que quepa en la fila del titulo */
            .card:not(.is-open) .card-toggle { padding: 6px 12px 4px 10px; font-size: 13px; }
            .card:not(.is-open) .card-toggle .t-more { font-size: 13px; }
            #shelf:not(.is-open) .card-scroll, #writings:not(.is-open) .card-scroll { padding-top: 22px; }
            /* ampliados: la forma inclinada en % cortaba mucho por la izquierda en bloques tan anchos;
               con medidas fijas se mantiene el estilo sin comerse imagenes ni textos */
            .card.is-open { --shape: polygon(0 8px, calc(100% - 16px) 0, 100% calc(100% - 8px), 10px 100%); --tilt: 0deg; }
            .card.is-open .card-scroll { padding-left: 34px !important; padding-right: 34px !important; }
            /* hueco arriba para que el boton "Back to main" no pise los titulos */
            body.focus-shelf #shelf .card-scroll, body.focus-writings #writings .card-scroll { padding-top: 66px !important; }
        }

        /* con la navegacion nueva, en portatiles el contacto queda solo con iconos */
        @media (max-width: 1439px) and (min-width: 1024px) {
            .contact a.link span { display: none; }
            .contact { gap: 12px; }
        }

        /* ================= ESCRITORIO ESTRECHO ================= */
        @media (max-width: 1279px) and (min-width: 1024px) {
            #goods { width: 74vw; gap: 26px; }
            #panel { width: 74vw; }
            .card-scroll { padding: 4px 18px 18px; }
            #dialogueText { font-size: 18px; }
            .contact a.link span { display: none; }
        }

        /* ================= MOVIL Y TABLET ================= */
        @media (max-width: 1023px) {
            :root { --header-h: 58px; }
            #header { padding: 0 14px 6px; }
            .brand-name { font-size: 18px; }
            .brand-sub { font-size: 11px; }
            .contact { gap: 12px; }
            .contact a.link span, .btn-cv .long { display: none; }
            .btn-cv { font-size: 16px; padding: 6px 12px 4px; }
            .brand { flex: 1; overflow: hidden; }
            .brand-mark { font-size: 18px; padding: 3px 7px 1px; }
            .contact { flex-shrink: 0; }
            .contact a.link i { width: 28px; height: 28px; font-size: 13px; }
            .contact a[href^="tel:"] { display: none; }
            body.intro-done .dialogue-box { padding-top: 22px !important; }

            #stage { overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
            .bg-layer { position: fixed; }
            .bg-slab, .bg-slab2 { top: auto; }
            #shopkeeper { position: relative; left: auto; transform: none; width: min(460px, 92vw); margin: 18px auto 0; bottom: auto; }
            /* tras la intro el tendero se encoge y se queda anclado abajo */
            body.intro-done #shopkeeper { position: fixed; left: 8px; right: 8px; width: auto; bottom: calc(var(--ticker-h) + 6px); margin: 0;
                flex-direction: row; align-items: flex-end; gap: 0; animation: dock .5s var(--ease-out); }
            @keyframes dock { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: none; } }
            body.intro-done .keeper-art { width: 92px; flex-shrink: 0; margin: 0 -8px 0 0; z-index: 2; }
            body.intro-done .burst { display: none; }
            body.intro-done .dialogue { flex: 1; min-width: 0; }
            body.intro-done .dialogue-box { padding: 18px 16px 12px; min-height: 0; }
            body.intro-done #dialogueText { font-size: 15px; min-height: 3.6em; }
            body.intro-done .nametag { font-size: 14px; top: -12px; }

            #goods { position: relative; top: auto; right: auto; bottom: auto; width: auto; display: flex; flex-direction: column; gap: 30px;
                padding: 18px 18px 190px; }
            body:not(.intro-done) #goods { display: none; }
            .card { transform: translateY(60px); }
            .card-scroll { overflow: visible; }
            .sheet-name { font-size: 40px; }
            /* orden en movil: CV, proyectos y articulos */
            .col-left { display: contents; }
            #sheet { order: 1; } #shelf { order: 2; } #writings { order: 3; }
            #writings .card-scroll { max-height: none; }
            .sections { margin-right: 6px; gap: 2px; margin-left: 8px; padding-left: 6px; }
            .sections a.ext .ext-ico { display: none; }
            .contact { padding-left: 6px; }
            .sections a { padding: 6px 8px 4px; }
            .sections a span { display: none; }
            /* en movil se lee todo seguido: siempre la version completa, sin expandir */
            .less, .card-toggle, .mini-label { display: none !important; }
            .more { display: grid; grid-template-columns: 1fr !important; gap: 0 !important; }
            #panel { width: 100%; clip-path: none; z-index: 120; top: var(--header-h); bottom: 0; }
            #panel::before { display: none; }
            #panelBody, .panel-foot { padding-left: 20px; padding-right: 20px; }
        }

        /* moviles estrechos: en la cabecera solo queda el logo C4, las secciones y el contacto */
        @media (max-width: 480px) {
            .brand > span:not(.brand-mark) { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>

    <div id="loading" aria-hidden="true"><div class="word">Loading</div></div>
    <div id="swipe" aria-hidden="true"></div>

    <header id="header">
        <a class="brand" href="#" aria-label="Juan A. Calero">
            <span class="brand-mark">C4</span>
            <span style="display:flex;flex-direction:column;gap:3px;min-width:0">
                <span class="brand-name">Juan A. Calero</span>
                <span class="brand-sub">Game Designer &amp; Producer</span>
            </span>
        </a>
        <nav class="sections" aria-label="Sections">
            <a href="#cv" data-nav="cv" onclick="goNav('cv', event)"><i class="fa-solid fa-id-card"></i><span>CV</span></a>
            <a href="#projects" data-nav="projects" onclick="goNav('projects', event)"><i class="fa-solid fa-gamepad"></i><span>Projects</span></a>
            <a href="#writings" data-nav="writings" onclick="goNav('writings', event)"><i class="fa-solid fa-pen-nib"></i><span>Writings</span></a>
            <a href="https://c4lipo.itch.io" target="_blank" rel="noopener" class="ext" title="My jam games on itch.io"><i class="fa-brands fa-itch-io"></i><span>itch.io</span><i class="fa-solid fa-arrow-up-right-from-square ext-ico"></i></a>
        </nav>
        <nav class="contact">
            <a class="link" href="https://www.linkedin.com/in/juanantoniocalero/" target="_blank" rel="noopener noreferrer"><i class="fa-brands fa-linkedin-in"></i><span>LinkedIn</span></a>
            <a class="link" href="tel:+34633614852"><i class="fa-solid fa-phone"></i><span>+34 633 614 852</span></a>
            <a class="link" href="mailto:jacalerodev@gmail.com"><i class="fa-solid fa-envelope"></i><span>jacalerodev@gmail.com</span></a>
            <a class="btn-cv" href="assets/cv-juan-a-calero.pdf" download="Juan A. Calero - CV.pdf"><i class="fa-solid fa-download"></i><span><span class="long">Download </span>CV</span></a>
        </nav>
    </header>

    <main id="stage" onclick="onStageClick(event)">
        <div class="bg-layer bg-dots"></div>
        <div class="bg-layer bg-stripes"></div>
        <div class="bg-layer bg-word" aria-hidden="true">CALERO</div>
        <div class="bg-layer bg-slab2"></div>
        <div class="bg-layer bg-slab"></div>

        <!-- TENDERO -->
        <div id="shopkeeper">
            <div class="keeper-art" onclick="onKeeperClick(event)">
                <div class="burst"></div>
                <img id="keeperImg" class="keeper-img" src="assets/silueta.png" alt="Juan A. Calero">
            </div>
            <div class="dialogue" onclick="onKeeperClick(event)" role="status" aria-live="polite">
                <div class="dialogue-shadow"></div>
                <div class="nametag"><span>Calero</span></div>
                <div class="dialogue-box">
                    <p id="dialogueText"></p>
                    <span class="next"></span>
                </div>
            </div>
        </div>

        <!-- MERCANCIA: ficha + estanteria, entran en el hueco que deja el tendero -->
        <div id="goods">
          <div class="col-left">
            <section id="sheet" class="card" onclick="onCardClick('sheet', event)" aria-label="CV">
                <button class="card-toggle" onclick="toggleFocus('sheet', event)" aria-label="Expand CV"><i class="fa-solid fa-plus ic-open"></i><span class="t-more">Click to read more</span><i class="fa-solid fa-arrow-left ic-back"></i><span class="t-back">Back to main</span></button>
                <div class="card-frame"><div class="card-inner">
                    <div class="mini-label"><i class="fa-solid fa-plus"></i><span>CV</span></div>
                    <div class="sheet-head">
                        <h1 class="sheet-name" id="sheetName"></h1>
                        <span class="tag tag-paper"><span id="sheetTitle"></span></span>
                    </div>
                    <div class="card-scroll" id="sheetBody"></div>
                </div></div>
            </section>

            <!-- tercer bloque: articulos -->
            <section id="writings" class="card" onclick="onCardClick('writings', event)" aria-label="Writings">
                <button class="card-toggle" onclick="toggleFocus('writings', event)" aria-label="Expand writings"><i class="fa-solid fa-plus ic-open"></i><span class="t-more">Click to read more</span><i class="fa-solid fa-arrow-left ic-back"></i><span class="t-back">Back to main</span></button>
                <div class="card-frame"><div class="card-inner">
                    <div class="card-scroll">
                        <div class="shelf-title">Writings</div>
